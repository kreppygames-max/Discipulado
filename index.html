<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F5F0;--card:#fff;--muted:#F0EDE6;
  --border:#E4E0D8;--border2:#C8C3BA;
  --text:#1A1816;--text2:#6B6560;--text3:#9E9890;
  --accent:#4A3F8C;--al:#EAE8F5;--ad:#332B6B;
  --green:#3B6D11;--gl:#EAF3DE;
  --amber:#854F0B;--ambl:#FAEEDA;
  --red:#A32D2D;--redl:#FCEBEB;
  --r:10px;--rl:16px;--rs:6px;
  --sh:0 1px 4px rgba(0,0,0,.07);
  --sh2:0 4px 16px rgba(0,0,0,.10);
  --sidebar-w:264px;
  --topbar2:52px;
}
[data-theme="dark"]{
  --bg:#151412;--card:#1E1C19;--muted:#252320;
  --border:#2E2B27;--border2:#3D3A34;
  --text:#F0EDE6;--text2:#9E9890;--text3:#6B6560;
  --accent:#7B6FCC;--al:#252240;--ad:#9B8FE8;
  --green:#6AAF36;--gl:#1A2E0D;
  --amber:#D4863A;--ambl:#2E1E08;
  --red:#D45555;--redl:#2E0F0F;
  --sh:0 1px 4px rgba(0,0,0,.3);
  --sh2:0 4px 16px rgba(0,0,0,.4);
}
html{font-size:15px}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
.hide{display:none!important}
.page{padding:1.5rem;max-width:900px;margin:0 auto}
.gap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* LOADING */
#loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem}
.spin{font-size:32px;color:var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* SHELL / SIDEBAR (nova IA — inspirada em plataformas de curso) */
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:background .2s,border-color .2s,transform .25s;z-index:250}
.sidebar-top{padding:1.1rem 1rem .8rem;border-bottom:1px solid var(--border)}
.brand-row{display:flex;align-items:center;gap:8px;font-family:'Lora',serif;font-size:17px;font-weight:500;margin-bottom:.9rem}
.brand-row .x{color:var(--accent);font-size:19px}
.workspace-switch{display:flex;align-items:center;gap:6px;background:var(--muted);border:1px solid var(--border);border-radius:var(--r);padding:7px 9px}
.workspace-switch select{flex:1;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:12.5px;color:var(--text);outline:none;cursor:pointer;width:100%}
.workspace-name{font-size:12.5px;font-weight:500;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-icon{font-size:14px;flex-shrink:0}
.sidebar-nav{flex:1;overflow-y:auto;padding:.6rem .7rem}
.snav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:var(--r);border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:13.5px;color:var(--text2);cursor:pointer;text-align:left;margin-bottom:2px;transition:.15s}
.snav-item:hover{background:var(--muted);color:var(--text)}
.snav-item.active{background:var(--al);color:var(--accent);font-weight:500}
.snav-ico{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sidebar-bottom{padding:.7rem .7rem 1rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.sidebar-bottom .snav-item{color:var(--text3)}
.sidebar-user-email{font-size:11px;color:var(--text3);padding:2px 11px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar-slim{height:var(--topbar2);flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 1.25rem;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:150;transition:background .2s,border-color .2s}
.page-title{font-family:'Lora',serif;font-size:15px;font-weight:500}
.mobile-menu-btn{display:none;background:transparent;border:none;font-size:19px;color:var(--text2);cursor:pointer}
.sidebar-backdrop{display:none}
@media(max-width:880px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:var(--sh2)}
  .sidebar.open{transform:translateX(0)}
  .mobile-menu-btn{display:block}
  .sidebar-backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:240}
}

/* LOGIN / SETUP */
#login-screen,#setup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--bg)}
.login-card,.setup-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:2.5rem;max-width:380px;width:100%;box-shadow:var(--sh2)}
.login-logo{text-align:center;margin-bottom:2rem}
.login-logo .cross{font-size:30px;color:var(--accent);display:block;margin-bottom:.5rem}
.login-logo h2{font-family:'Lora',serif;font-size:19px;font-weight:500}
.login-logo p{font-size:13px;color:var(--text2);margin-top:3px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:1.25rem}
.stat{background:var(--muted);border-radius:var(--r);padding:.9rem 1rem;transition:background .2s}
.stat-l{font-size:11px;font-weight:500;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
.stat-v{font-size:24px;font-weight:600;line-height:1}
.stat-s{font-size:12px;color:var(--text2);margin-top:2px}

/* BOX / CARD */
.box{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:1.25rem;box-shadow:var(--sh);transition:background .2s,border-color .2s}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:8px}
.sh-t{font-family:'Lora',serif;font-size:16px;font-weight:500}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;text-decoration:none;transition:.15s;white-space:nowrap}
.btn-acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-acc:hover{background:var(--ad)}
.btn-out{background:transparent;border-color:var(--border2);color:var(--text2)}
.btn-out:hover{background:var(--muted);color:var(--text)}
.btn-ghost{background:transparent;color:var(--text2)}
.btn-ghost:hover{background:var(--muted)}
.btn-green{background:var(--gl);color:var(--green);border-color:#C0DD97}
.btn-green:hover{filter:brightness(.95)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-danger{background:var(--redl);color:var(--red);border-color:#F0B3B3}
.btn-danger:hover{filter:brightness(.95)}
.btn-full{width:100%;justify-content:center;padding:10px}
.btn:disabled{opacity:.6;cursor:default}

/* FORM */
.fg{margin-bottom:1rem}
.fl{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
.fi{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:14px;background:var(--card);color:var(--text);outline:none;transition:.15s}
.fi:focus{border-color:var(--accent)}
textarea.fi{resize:vertical;min-height:80px}
select.fi{cursor:pointer}

/* BADGES */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap}
.bg-green{background:var(--gl);color:var(--green)}
.bg-gray{background:var(--muted);color:var(--text2)}
.bg-acc{background:var(--al);color:var(--accent)}
.bg-amber{background:var(--ambl);color:var(--amber)}
.bg-red{background:var(--redl);color:var(--red)}

/* NOTIF */
.notif{border-radius:var(--rs);padding:9px 13px;font-size:13px;margin-bottom:1rem}
.notif-ok{background:var(--gl);color:var(--green);border:1px solid #C0DD97}
.notif-err{background:var(--redl);color:var(--red);border:1px solid #F0B3B3}

/* HERO (só no Início) */
.hero{background:var(--accent);color:#fff;padding:2rem 1.5rem;text-align:center;position:relative;overflow:hidden;border-radius:var(--rl);margin-bottom:1.25rem}
.hero::before{content:'✝';position:absolute;font-size:140px;opacity:.08;top:-10px;right:-10px;line-height:1;pointer-events:none}
.hero h1{font-family:'Lora',serif;font-size:23px;font-weight:400;margin-bottom:.3rem}
.hero p{font-size:13.5px;opacity:.8}

/* DASHBOARD PROGRESSO */
.dash-hero{display:flex;align-items:center;gap:1.25rem;background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:1.4rem;box-shadow:var(--sh);margin-bottom:1.25rem;flex-wrap:wrap}
.progress-ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.progress-ring-inner{width:52px;height:52px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--accent)}
.dash-hero-info{flex:1;min-width:180px}
.dash-eyebrow{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.dash-title{font-family:'Lora',serif;font-size:16px}

/* SPLIT LAYOUT (currículo público + chamada admin, unificados) */
.split-layout{display:grid;grid-template-columns:270px 1fr;gap:1.25rem;align-items:start}
@media(max-width:760px){.split-layout{grid-template-columns:1fr}}
.split-side{position:sticky;top:calc(var(--topbar2) + 20px)}
@media(max-width:760px){.split-side{position:static}}
.split-side-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:10px 4px 4px}
.split-side-label:first-child{padding-top:0}
.lesson-list-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12.5px;text-align:left;width:100%;margin-bottom:4px;transition:.15s}
.lesson-list-btn:hover{background:var(--muted)}
.lesson-list-btn.active{background:var(--al);border-color:var(--accent);color:var(--accent);font-weight:500}
.lesson-status{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;background:var(--muted);color:var(--text3)}
.lesson-list-btn.done .lesson-status{background:var(--gl);color:var(--green)}
.lesson-detail-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:1.5rem;box-shadow:var(--sh)}
.lesson-eyebrow{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.lesson-title{font-family:'Lora',serif;font-size:21px;font-weight:500}
.lesson-meta-grid{display:flex;flex-direction:column;gap:.5rem;margin-top:1.1rem}
.lesson-meta-item{background:var(--muted);border-radius:var(--r);padding:.7rem .9rem;font-size:13px;line-height:1.6}
.lesson-meta-item b{color:var(--text)}

/* MATERIAIS (linhas de arquivo, reaproveitado em vários lugares) */
.mat-list{display:flex;flex-direction:column;gap:6px;margin-top:.75rem}
.mat-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.mat-row:last-of-type{border-bottom:none}

/* ADMIN: CONTEÚDO (módulos + materiais unificados) */
.adm-mod-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.adm-mod-head{display:flex;align-items:center;gap:10px;padding:.85rem 1.25rem;background:var(--al);cursor:pointer;transition:.15s}
.adm-mod-head:hover{filter:brightness(.97)}
.adm-mod-title{font-size:14px;font-weight:500;flex:1;color:var(--accent)}
.enc-item{border-bottom:1px solid var(--border)}
.enc-item:last-child{border-bottom:none}
.adm-enc-row{display:flex;align-items:center;gap:10px;padding:.65rem 1.25rem;transition:.15s}
.adm-enc-row:hover{background:var(--muted)}
.adm-enc-name{flex:1;font-size:13px}
.adm-add-enc{display:flex;align-items:center;gap:8px;padding:.6rem 1.25rem;background:var(--muted)}
.adm-actions{display:flex;gap:6px;align-items:center}
.enc-body-inner{padding:.25rem 1.25rem 1rem 3.5rem}

/* PRESENÇA */
.pres-list{display:flex;flex-direction:column;gap:8px}
.pres-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;transition:.15s}
.pres-row.freq-baixa{border-left:3px solid var(--amber)}
.pres-row.freq-critica{border-left:3px solid var(--red)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
.pname{font-size:14px;font-weight:500}
.pfreq{font-size:11px;color:var(--text3)}
.tog{padding:5px 13px;border-radius:20px;border:1px solid;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;min-width:76px;text-align:center}
.tog-p{background:var(--gl);color:var(--green);border-color:#C0DD97}
.tog-a{background:var(--muted);color:var(--text2);border-color:var(--border2)}

/* FREQ BARS */
.fb-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.fb-name{font-size:13px;width:100px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-track{flex:1;height:7px;background:var(--muted);border-radius:4px;overflow:hidden}
.fb-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.fb-pct{font-size:12px;color:var(--text2);width:36px;text-align:right}

/* TABLE */
.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.dt td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.dt tr:last-child td{border-bottom:none}
.dt tr:hover td{background:var(--muted)}
.dt tr{cursor:pointer}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:500;padding:1rem;backdrop-filter:blur(2px)}
.modal{background:var(--card);border-radius:var(--rl);padding:1.5rem;width:100%;max-width:440px;box-shadow:0 12px 40px rgba(0,0,0,.2);animation:sup .2s ease;max-height:90vh;overflow-y:auto}
@keyframes sup{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-t{font-family:'Lora',serif;font-size:17px;font-weight:500;margin-bottom:1.25rem}
.modal-f{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem}
.modal-lg{max-width:600px}
.confirm-modal{max-width:360px;text-align:center}
.confirm-icon{font-size:30px;margin-bottom:.5rem}
.confirm-msg{font-size:13.5px;color:var(--text2);margin-bottom:0;line-height:1.6}

/* EMPTY / ONBOARDING */
.empty{text-align:center;padding:3rem 1rem;color:var(--text2);font-size:14px}
.empty-i{font-size:36px;margin-bottom:.75rem;opacity:.35}
.onboard-card{max-width:420px;margin:3rem auto;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:2.5rem 2rem;box-shadow:var(--sh)}
.onboard-icon{font-size:38px;margin-bottom:1rem}

/* AVISO CARD (público) */
.aviso-card{background:var(--accent);color:#fff;border-radius:var(--rl);padding:1.5rem;margin-bottom:1.25rem;position:relative;overflow:hidden}
.aviso-card::before{content:'📢';position:absolute;font-size:80px;opacity:.08;right:-10px;bottom:-10px}
.aviso-card h3{font-family:'Lora',serif;font-size:18px;font-weight:500;margin-bottom:.75rem}
.aviso-detail{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.9;margin-bottom:.35rem}
.aviso-detail span{font-size:15px}
.aviso-versiculo{background:rgba(255,255,255,.15);border-radius:var(--rs);padding:.6rem .9rem;font-size:13px;font-style:italic;margin-top:.75rem;line-height:1.5}
.aviso-tarefa{background:rgba(255,255,255,.1);border-radius:var(--rs);padding:.6rem .9rem;font-size:13px;margin-top:.5rem}

/* ORAÇÃO CARD */
.oracao-row{display:flex;align-items:flex-start;gap:10px;padding:.75rem 0;border-bottom:1px solid var(--border)}
.oracao-row:last-child{border-bottom:none}
.oracao-check{width:20px;height:20px;border-radius:5px;border:2px solid var(--border2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;transition:.15s;margin-top:2px}
.oracao-check.done{background:var(--green);border-color:var(--green);color:#fff}
.oracao-txt{flex:1;font-size:13px;line-height:1.5}
.oracao-txt.done-txt{text-decoration:line-through;color:var(--text3)}

/* PERFIL DISC */
.perfil-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}
.perfil-info h2{font-family:'Lora',serif;font-size:20px;font-weight:500}
.perfil-info p{font-size:13px;color:var(--text2)}
.hist-row{display:flex;align-items:center;gap:10px;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:13px}
.hist-row:last-child{border-bottom:none}
.hist-enc{flex:1;color:var(--text2)}
.hist-badge{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}

/* SITUAÇÃO */
.sit-ativo{background:var(--gl);color:var(--green)}
.sit-recem{background:var(--al);color:var(--accent)}
.sit-crescendo{background:var(--ambl);color:var(--amber)}
.sit-atencao{background:var(--redl);color:var(--red)}

/* CHART */
.chart-wrap{display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:.75rem;padding:0 4px}
.chart-bar-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:4px}
.chart-bar{width:100%;border-radius:4px 4px 0 0;transition:height .5s cubic-bezier(.4,0,.2,1);min-height:4px}
.chart-label{font-size:9px;color:var(--text3);text-align:center;white-space:nowrap;overflow:hidden;max-width:32px;text-overflow:ellipsis}

/* GRUPO CARD (usado só dentro do modal, se precisar listar) */
.grupo-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:1.25rem;box-shadow:var(--sh);cursor:pointer;transition:.2s;display:flex;align-items:center;gap:1rem;margin-bottom:10px}
.grupo-card:hover{border-color:var(--accent);box-shadow:var(--sh2)}
.grupo-icon{width:42px;height:42px;border-radius:10px;background:var(--al);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

/* UNSAVED WARNING */
.unsaved-bar{position:fixed;bottom:0;left:0;right:0;background:var(--amber);color:#fff;padding:.6rem 1.25rem;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:500;z-index:300;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

@media(max-width:520px){
  .page{padding:1rem}
  .hero{padding:1.5rem 1rem}
  .hero h1{font-size:19px}
}
</style>
</head>
<body>

<div id="loading"><div class="spin">✝</div><p style="color:var(--text2)">Carregando...</p></div>

<div id="setup" class="hide">
  <div class="setup-card">
    <div style="text-align:center;margin-bottom:1.5rem"><span style="font-size:28px;color:var(--accent)">✝</span><h2 style="font-family:'Lora',serif;font-size:18px;margin-top:.5rem">Configure o Supabase</h2></div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:1rem">Preencha as chaves no topo do arquivo HTML:</p>
    <div style="background:var(--muted);border:1px solid var(--border);border-radius:var(--rs);padding:.75rem 1rem;font-family:monospace;font-size:11px;line-height:1.8;word-break:break-all">
      SUPABASE_URL = '<b style="color:var(--accent)">sua-url</b>'<br>SUPABASE_KEY = '<b style="color:var(--accent)">sua-key</b>'
    </div>
  </div>
</div>

<div id="login-screen" class="hide">
  <div class="login-card">
    <div class="login-logo"><span class="cross">✝</span><h2>Área do Discipulador</h2><p>Acesso restrito</p></div>
    <div class="fg"><label class="fl">E-mail</label><input class="fi" id="login-email" type="email" placeholder="seu@email.com"></div>
    <div class="fg"><label class="fl">Senha</label><input class="fi" id="login-senha" type="password" placeholder="••••••••"></div>
    <div id="login-err" class="notif notif-err hide"></div>
    <button class="btn btn-acc btn-full" id="login-btn">Entrar</button>
    <button class="btn btn-ghost btn-full" style="margin-top:8px" id="login-voltar">← Voltar</button>
  </div>
</div>

<div id="app" class="hide">
  <div class="shell">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="brand-row"><span class="x">✝</span> Discipulado</div>
        <div id="ws-slot"></div>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-bottom">
        <div class="sidebar-user-email" id="sidebar-user-email"></div>
        <button class="snav-item" id="dark-toggle"><span class="snav-ico" id="dark-ico">🌙</span><span id="dark-label">Modo escuro</span></button>
        <button class="snav-item hide" id="btn-logout"><span class="snav-ico">↩</span> Sair</button>
        <button class="snav-item hide" id="btn-login-link"><span class="snav-ico">🔑</span> Área do discipulador</button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main-col">
      <header class="topbar-slim">
        <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
        <span class="page-title" id="page-title">Início</span>
        <div style="flex:1"></div>
        <div id="page-actions" class="gap" style="gap:8px"></div>
      </header>
      <div id="content"></div>
    </div>
  </div>
</div>

<script>
// ═══ ESTADO ═══
let sb, session = null;
let grupoAtual = null;   // {id, nome, descricao, user_id}
let grupos = [];         // grupos do discipulador logado
let modulos = [], discipulandos = [], chamadas = [], avisos = [], oracoes = [];
let viewAtual = '';
let _chamadaAtual = new Map();
let _encSel = null;        // encontro selecionado na Chamada (admin)
let _pubEncSel = null;     // encontro selecionado no Currículo (público)
let _conteudoMod = null;   // módulo expandido em Conteúdo (admin)
let _conteudoEnc = null;   // encontro expandido em Conteúdo (admin)
let _chamadaSuja = false;

const PUB_NAV = [
  {id:'inicio', label:'Início', icon:'🏠'},
  {id:'encontros', label:'Encontros', icon:'📖'},
  {id:'frequencia', label:'Frequência', icon:'📊'},
];
const ADMIN_NAV = [
  {id:'chamada', label:'Chamada', icon:'✅'},
  {id:'relatorios', label:'Relatórios', icon:'📈'},
  {id:'conteudo', label:'Conteúdo', icon:'📚'},
  {id:'discipulandos', label:'Discipulandos', icon:'👥'},
  {id:'oracoes-adm', label:'Oração', icon:'🙏'},
  {id:'avisos-adm', label:'Avisos', icon:'📢'},
];
const PUB_VIEWS = PUB_NAV.map(n=>n.id);
const ADMIN_VIEWS = ADMIN_NAV.map(n=>n.id);
const TITLES = {inicio:'Início', encontros:'Encontros', frequencia:'Minha frequência', chamada:'Chamada', relatorios:'Relatórios', conteudo:'Conteúdo', discipulandos:'Discipulandos', 'oracoes-adm':'Pedidos de oração', 'avisos-adm':'Avisos'};

const CORES = [
  ['#EAE8F5','#4A3F8C'],['#EAF3DE','#3B6D11'],['#FAECE7','#993C1D'],
  ['#E6F1FB','#185FA5'],['#FAEEDA','#854F0B'],['#FBEAF0','#993556'],
  ['#fcebeb','#A32D2D'],['#E1F5EE','#085041'],['#F1EFE8','#5F5E5A'],
  ['#EAE8F5','#26215C'],['#FAECE7','#4A1B0C'],
];

const SITUACOES = {
  ativo: {label:'Ativo', cls:'sit-ativo'},
  recem_convertido: {label:'Recém convertido', cls:'sit-recem'},
  crescendo: {label:'Crescendo', cls:'sit-crescendo'},
  precisa_atencao: {label:'Precisa de atenção', cls:'sit-atencao'},
};

function av(nome, idx, sz=36) {
  const [bg,fg] = CORES[idx % CORES.length];
  const ini = (nome||'?').split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
  return `<div class="av" style="width:${sz}px;height:${sz}px;background:${bg};color:${fg};flex-shrink:0">${ini}</div>`;
}

// ═══ DARK MODE ═══
function applyTheme(dark){
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : '');
  const ico=el('dark-ico'), lbl=el('dark-label');
  if(ico) ico.textContent = dark ? '☀️' : '🌙';
  if(lbl) lbl.textContent = dark ? 'Modo claro' : 'Modo escuro';
  localStorage.setItem('theme', dark ? 'dark' : 'light');
}

// ═══ HELPERS ═══
function show(id){ document.getElementById(id)?.classList.remove('hide') }
function hide(id){ document.getElementById(id)?.classList.add('hide') }
function el(id){ return document.getElementById(id) }
function todosEncontros(){ return modulos.flatMap(m => m.encontros.map(e=>({...e,mod_titulo:m.titulo,mod_numero:m.numero,mod_id:m.id}))); }

function getFreq(discId) {
  const enc = todosEncontros().filter(e=>e.realizado);
  const total = enc.length;
  if(!total) return {pct:0,pres:0,total:0};
  const pres = enc.filter(e=>chamadas.some(c=>c.encontro_id===e.id&&c.discipulando_id===discId&&c.presente)).length;
  return {pct:Math.round(pres/total*100),pres,total};
}

function fmtData(d){ if(!d)return''; return new Date(d+'T12:00:00').toLocaleDateString('pt-BR'); }
function fmtTam(kb){ if(!kb)return''; return kb>=1024?(kb/1024).toFixed(1)+' MB':kb+' KB'; }

function notif(msg, tipo='ok') {
  const n = document.createElement('div');
  n.className = `notif notif-${tipo}`;
  n.style.cssText='position:fixed;top:16px;right:1rem;z-index:400;box-shadow:var(--sh2);max-width:320px;animation:sup .2s ease';
  n.textContent = (tipo==='ok'?'✓ ':'✗ ') + msg;
  document.body.appendChild(n);
  setTimeout(()=>n.remove(), 3500);
}

function sanitizePath(name) {
  return name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]/g,'_');
}

function encontroTemChamada(encId) {
  return chamadas.some(c => c.encontro_id === encId);
}

// Modal de confirmação customizado — substitui o confirm() nativo do navegador
// para manter consistência visual (princípio de consistência/padrões da IHC).
function confirmDialog(msg, opts={}) {
  return new Promise(resolve => {
    const ow=document.createElement('div'); ow.className='overlay';
    ow.innerHTML=`<div class="modal confirm-modal">
      <div class="confirm-icon">${opts.danger?'⚠️':'❓'}</div>
      <div class="confirm-msg">${msg}</div>
      <div class="modal-f" style="justify-content:center">
        <button class="btn btn-ghost" id="cf-no">Cancelar</button>
        <button class="btn ${opts.danger?'btn-danger':'btn-acc'}" id="cf-yes">${opts.confirmLabel||'Confirmar'}</button>
      </div></div>`;
    document.body.appendChild(ow);
    const close=(val)=>{ow.remove();resolve(val);};
    ow.addEventListener('click',e=>e.target===ow&&close(false));
    ow.querySelector('#cf-no').onclick=()=>close(false);
    ow.querySelector('#cf-yes').onclick=()=>close(true);
  });
}

// ═══ INIT ═══
window.addEventListener('DOMContentLoaded', async () => {
  applyTheme(localStorage.getItem('theme') === 'dark');
  el('dark-toggle').addEventListener('click', () => applyTheme(document.documentElement.getAttribute('data-theme') !== 'dark'));

  if (!SUPABASE_URL || SUPABASE_URL.includes('COLE') || !SUPABASE_KEY || SUPABASE_KEY.includes('COLE')) {
    show('setup'); hide('loading'); return;
  }
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data } = await sb.auth.getSession();
    session = data.session;
    sb.auth.onAuthStateChange((event, s) => {
      session = s;
      if (event === 'SIGNED_OUT') { grupoAtual=null; grupos=[]; carregarDadosPublicos().then(renderApp); }
    });
    if (session) {
      grupos = await carregarGrupoDoUser();
      grupoAtual = grupos[0] || null;
    }
    await carregarDadosPublicos();
    hide('loading'); show('app');
    renderApp();
  } catch(e) {
    el('loading').innerHTML = `<div style="color:var(--red);font-size:32px">!</div><p style="color:var(--red);max-width:300px;text-align:center">Erro de conexão.<br>${e.message}</p>`;
  }

  el('mobile-menu-btn').addEventListener('click', ()=>{ el('sidebar').classList.add('open'); el('sidebar-backdrop').classList.add('show'); });
  el('sidebar-backdrop').addEventListener('click', closeMobileSidebar);
});
function closeMobileSidebar(){ el('sidebar').classList.remove('open'); el('sidebar-backdrop').classList.remove('show'); }

// ═══ DADOS ═══
async function carregarDadosPublicos() {
  const gid = grupoAtual?.id;
  const [r1, r2, r3, r4, r5] = await Promise.all([
    gid ? sb.from('modulos').select('*, encontros(*, materiais(*))').eq('grupo_id', gid).order('numero')
         : sb.from('modulos').select('*, encontros(*, materiais(*))').order('numero'),
    gid ? sb.from('discipulandos').select('*').eq('ativo', true).eq('grupo_id', gid).order('nome')
         : sb.from('discipulandos').select('*').eq('ativo', true).order('nome'),
    sb.from('chamadas').select('*'),
    gid ? sb.from('avisos').select('*').eq('grupo_id', gid).eq('ativo', true).order('criado_em', {ascending:false})
         : sb.from('avisos').select('*').eq('ativo', true).order('criado_em', {ascending:false}),
    gid ? sb.from('oracoes').select('*').eq('grupo_id', gid).order('criado_em', {ascending:false})
         : sb.from('oracoes').select('*').order('criado_em', {ascending:false}),
  ]);
  modulos       = r1.data || [];
  discipulandos = r2.data || [];
  chamadas      = r3.data || [];
  avisos        = r4.data || [];
  oracoes       = r5.data || [];
  modulos.forEach(m => {
    m.encontros = (m.encontros||[]).sort((a,b)=>a.numero-b.numero);
    m.encontros.forEach(e => { e.materiais = e.materiais||[]; });
  });
}

async function carregarGrupoDoUser() {
  if (!session) return [];
  const { data } = await sb.from('grupos').select('*').eq('user_id', session.user.id).order('criado_em');
  return data || [];
}

// ═══ APP SHELL ═══
function renderApp() {
  el('sidebar-user-email').textContent = session ? session.user.email : '';
  el('btn-logout').classList.toggle('hide', !session);
  el('btn-login-link').classList.toggle('hide', !!session);
  renderWorkspaceArea();

  if (session) {
    if (!ADMIN_VIEWS.includes(viewAtual)) viewAtual = 'chamada';
    renderSidebarNav(ADMIN_NAV);
  } else {
    if (!PUB_VIEWS.includes(viewAtual)) viewAtual = 'inicio';
    renderSidebarNav(PUB_NAV);
  }
  renderView(viewAtual);

  el('btn-logout').onclick = async () => { grupoAtual=null; grupos=[]; await sb.auth.signOut(); };
  el('btn-login-link').onclick = () => { closeMobileSidebar(); hide('app'); show('login-screen'); setTimeout(()=>el('login-email').focus(),50); };
}

function renderWorkspaceArea() {
  const slot = el('ws-slot');
  if (!session) { slot.innerHTML=''; return; }
  let html='';
  if (grupos.length > 1) {
    html += `<div class="workspace-switch"><span class="ws-icon">🏠</span><select id="ws-select">${grupos.map(g=>`<option value="${g.id}"${grupoAtual&&g.id===grupoAtual.id?' selected':''}>${g.nome}</option>`).join('')}</select></div>`;
  } else if (grupos.length === 1) {
    html += `<div class="workspace-switch"><span class="ws-icon">🏠</span><span class="workspace-name">${grupos[0].nome}</span></div>`;
  }
  html += `<button class="btn btn-out btn-sm btn-full" id="btn-new-group" style="margin-top:6px">+ Novo grupo</button>`;
  slot.innerHTML = html;
  const sel = el('ws-select');
  if (sel) sel.addEventListener('change', async (e) => {
    const novo = grupos.find(g=>g.id===e.target.value); if(!novo) return;
    grupoAtual = novo;
    await carregarDadosPublicos();
    renderView(viewAtual);
    notif(`Grupo "${novo.nome}" selecionado.`);
  });
  el('btn-new-group').addEventListener('click', ()=>abrirModalGrupo());
}

function renderSidebarNav(items) {
  const nav = el('sidebar-nav');
  nav.innerHTML = items.map(it=>`<button class="snav-item${viewAtual===it.id?' active':''}" data-nav="${it.id}"><span class="snav-ico">${it.icon}</span>${it.label}</button>`).join('');
  nav.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if (viewAtual==='chamada' && _chamadaSuja) {
        const ok = await confirmDialog('Você tem alterações não salvas na chamada. Deseja sair mesmo assim?');
        if(!ok) return;
        _chamadaSuja=false; removerUnsavedBar();
      }
      closeMobileSidebar();
      renderView(btn.dataset.nav);
    });
  });
}

el('login-btn').onclick = async () => {
  const email=el('login-email').value.trim(), senha=el('login-senha').value;
  el('login-err').classList.add('hide'); el('login-btn').textContent='Entrando...'; el('login-btn').disabled=true;
  const {error} = await sb.auth.signInWithPassword({email,password:senha});
  el('login-btn').textContent='Entrar'; el('login-btn').disabled=false;
  if(error){ el('login-err').textContent='E-mail ou senha incorretos.'; el('login-err').classList.remove('hide'); return; }
  hide('login-screen'); show('app');
  grupos = await carregarGrupoDoUser();
  grupoAtual = grupos[0] || null;
  viewAtual = 'chamada';
  await carregarDadosPublicos();
  renderApp();
};
el('login-voltar').onclick=()=>{hide('login-screen');show('app');};
el('login-senha').addEventListener('keydown',e=>e.key==='Enter'&&el('login-btn').click());

// ═══ NOVO GRUPO (modal usado tanto pela sidebar quanto pelo onboarding) ═══
function abrirModalGrupo() {
  const ow = document.createElement('div');
  ow.className = 'overlay';
  ow.innerHTML = `<div class="modal"><div class="modal-t">Novo grupo</div>
    <div class="fg"><label class="fl">Nome do grupo *</label><input class="fi" id="g-nome" placeholder="Ex: Discipulado Jovens 2025"></div>
    <div class="fg"><label class="fl">Descrição (opcional)</label><input class="fi" id="g-desc" placeholder="Ex: Grupo de jovens da célula Centro"></div>
    <div id="g-err" class="notif notif-err hide"></div>
    <div class="modal-f"><button class="btn btn-ghost" id="g-cancel">Cancelar</button><button class="btn btn-acc" id="g-save">Criar grupo</button></div>
  </div>`;
  document.body.appendChild(ow);
  ow.addEventListener('click',e=>e.target===ow&&ow.remove());
  ow.querySelector('#g-cancel').onclick=()=>ow.remove();
  setTimeout(()=>ow.querySelector('#g-nome').focus(),50);
  ow.querySelector('#g-save').onclick = async () => {
    const nome = ow.querySelector('#g-nome').value.trim();
    if(!nome){ow.querySelector('#g-err').textContent='Informe o nome.';ow.querySelector('#g-err').classList.remove('hide');return;}
    ow.querySelector('#g-save').textContent='Criando...'; ow.querySelector('#g-save').disabled=true;
    const {data,error} = await sb.from('grupos').insert({nome, descricao:ow.querySelector('#g-desc').value.trim()||null, user_id:session.user.id}).select().single();
    if(error){ow.querySelector('#g-err').textContent=error.message;ow.querySelector('#g-err').classList.remove('hide');ow.querySelector('#g-save').textContent='Criar grupo';ow.querySelector('#g-save').disabled=false;return;}
    grupos.push(data);
    grupoAtual = data;
    ow.remove();
    await carregarDadosPublicos();
    renderWorkspaceArea();
    renderView(viewAtual);
    notif('Grupo criado!');
  };
}

// ═══ VIEWS (dispatcher) ═══
function renderView(v) {
  viewAtual = v;
  const c = el('content');
  c.innerHTML = '';
  el('page-actions').innerHTML = '';
  el('page-title').textContent = TITLES[v] || '';
  removerUnsavedBar();
  document.querySelectorAll('#sidebar-nav .snav-item[data-nav]').forEach(b=>b.classList.toggle('active', b.dataset.nav===v));

  if (session && !grupoAtual) { renderOnboarding(c); return; }

  if(v==='inicio')        renderInicio(c);
  if(v==='encontros')     renderEncontrosPublic(c);
  if(v==='frequencia')    renderFreqPublica(c);
  if(v==='chamada')       renderChamada(c);
  if(v==='relatorios')    renderRelatorios(c);
  if(v==='conteudo')      renderConteudoAdm(c);
  if(v==='discipulandos') renderDiscipulandos(c);
  if(v==='oracoes-adm')   renderOracoesAdm(c);
  if(v==='avisos-adm')    renderAvisosAdm(c);
}

function renderOnboarding(c) {
  const wrap=document.createElement('div'); wrap.className='page';
  wrap.innerHTML=`<div class="onboard-card"><div class="onboard-icon">🏠</div><div style="font-family:'Lora',serif;font-size:18px;margin-bottom:.5rem">Crie seu primeiro grupo</div><p style="font-size:13px;color:var(--text2);margin-bottom:1.25rem">Um grupo reúne os módulos, discipulandos e a chamada de um discipulado. Comece criando o seu para liberar o restante do painel.</p><button class="btn btn-acc" id="btn-onboard-criar">+ Criar grupo</button></div>`;
  c.appendChild(wrap);
  el('btn-onboard-criar').addEventListener('click',()=>abrirModalGrupo());
}

// ─── INÍCIO PÚBLICO (dashboard) ───
function renderInicio(c) {
  const wrap = document.createElement('div'); wrap.className = 'page';
  wrap.innerHTML = `<div class="hero"><h1>Discipulado</h1><p>${grupoAtual?grupoAtual.nome:'Bem-vindo(a) ao grupo'}</p></div>`;

  const enc = todosEncontros();
  const total = enc.length;
  const feitos = enc.filter(e=>e.realizado).length;
  const pct = total ? Math.round(feitos/total*100) : 0;
  const proximo = enc.find(e=>!e.realizado);

  if (total) {
    const heroCard = document.createElement('div'); heroCard.className='dash-hero';
    heroCard.innerHTML = `<div class="progress-ring" style="background:conic-gradient(var(--accent) ${pct*3.6}deg, var(--muted) 0)"><div class="progress-ring-inner">${pct}%</div></div>
      <div class="dash-hero-info"><div class="dash-eyebrow">Progresso do currículo</div>
      <div class="dash-title">${feitos} de ${total} encontros realizados</div>
      ${proximo?`<button class="btn btn-acc btn-sm" style="margin-top:8px" id="btn-continuar">${feitos?'Continuar':'Começar'}: ${proximo.titulo} →</button>`:'<div style="font-size:12.5px;color:var(--text2);margin-top:4px">Currículo concluído! 🎉</div>'}</div>`;
    wrap.appendChild(heroCard);
  }

  const avisosAtivos = avisos.filter(a=>a.ativo);
  if (avisosAtivos.length) {
    const a = avisosAtivos[0];
    const div = document.createElement('div');
    div.className = 'aviso-card';
    div.innerHTML = `<h3>${a.titulo}</h3>
      ${a.data_encontro?`<div class="aviso-detail"><span>📅</span><span>${fmtData(a.data_encontro)}</span></div>`:''}
      ${a.local?`<div class="aviso-detail"><span>📍</span><span>${a.local}</span></div>`:''}
      ${a.tema?`<div class="aviso-detail"><span>📖</span><span>${a.tema}</span></div>`:''}
      ${a.conteudo?`<div style="font-size:13px;margin-top:.5rem;opacity:.9">${a.conteudo}</div>`:''}
      ${a.versiculo?`<div class="aviso-versiculo">✝ ${a.versiculo}</div>`:''}
      ${a.tarefa?`<div class="aviso-tarefa">✏️ <b>Tarefa da semana:</b> ${a.tarefa}</div>`:''}`;
    wrap.appendChild(div);
  }

  const ors = oracoes.filter(o=>!o.respondido).slice(0,5);
  if (ors.length) {
    const box = document.createElement('div'); box.className = 'box';
    box.innerHTML = `<div class="sh" style="margin-bottom:.75rem"><span class="sh-t">🙏 Pedidos de oração</span></div>`;
    ors.forEach(o => {
      const row = document.createElement('div'); row.className = 'oracao-row';
      row.innerHTML = `<div class="oracao-txt">${o.pedido}</div>`;
      box.appendChild(row);
    });
    wrap.appendChild(box);
  }

  if (!total && !avisosAtivos.length && !ors.length) {
    wrap.innerHTML += `<div class="empty"><div class="empty-i">✝</div><p>Nenhum conteúdo publicado ainda.</p></div>`;
  }

  c.appendChild(wrap);
  const btnCont = el('btn-continuar');
  if (btnCont) btnCont.addEventListener('click', ()=>{ _pubEncSel = proximo.id; document.querySelector('#sidebar-nav [data-nav="encontros"]')?.click(); });
}

// ─── ENCONTROS PÚBLICO (currículo estilo curso) ───
function renderEncontrosPublic(c) {
  const enc = todosEncontros();
  if (!enc.length) { c.appendChild(Object.assign(document.createElement('div'),{className:'page',innerHTML:`<div class="empty"><div class="empty-i">📖</div><p>Nenhum encontro cadastrado ainda.</p></div>`})); return; }
  if (!_pubEncSel || !enc.find(e=>e.id===_pubEncSel)) _pubEncSel = (enc.find(e=>!e.realizado) || enc[0]).id;

  const wrap = document.createElement('div'); wrap.className = 'page';
  const layout = document.createElement('div'); layout.className = 'split-layout';

  const side = document.createElement('div'); side.className = 'split-side';
  let sHtml = '';
  modulos.forEach(mod=>{
    if (!mod.encontros.length) return;
    sHtml += `<div class="split-side-label">${mod.numero}. ${mod.titulo}</div>`;
    mod.encontros.forEach(e=>{
      sHtml += `<button class="lesson-list-btn${e.id===_pubEncSel?' active':''}${e.realizado?' done':''}" data-eid="${e.id}"><span class="lesson-status">${e.realizado?'✓':e.numero}</span><span>${e.titulo}</span></button>`;
    });
  });
  side.innerHTML = sHtml;
  side.querySelectorAll('[data-eid]').forEach(btn=>btn.addEventListener('click',()=>{ _pubEncSel=btn.dataset.eid; renderView('encontros'); }));
  layout.appendChild(side);

  const main = document.createElement('div');
  const encAtual = enc.find(e=>e.id===_pubEncSel);
  if (encAtual) {
    const card = document.createElement('div'); card.className='lesson-detail-card';
    let metaHtml='';
    if(encAtual.tema) metaHtml+=`<div class="lesson-meta-item">📖 <b>Tema:</b> ${encAtual.tema}</div>`;
    if(encAtual.versiculo) metaHtml+=`<div class="lesson-meta-item">✝ <b>Versículo:</b> <em>${encAtual.versiculo}</em></div>`;
    if(encAtual.tarefa) metaHtml+=`<div class="lesson-meta-item">✏️ <b>Tarefa da semana:</b> ${encAtual.tarefa}</div>`;
    card.innerHTML = `<div class="lesson-eyebrow">${encAtual.mod_titulo} · Encontro ${encAtual.numero}</div>
      <div class="lesson-title">${encAtual.titulo}</div>
      ${encAtual.data?`<div style="font-size:12px;color:var(--text3);margin-top:4px">${fmtData(encAtual.data)}</div>`:''}
      ${metaHtml?`<div class="lesson-meta-grid">${metaHtml}</div>`:''}`;
    const matWrap = document.createElement('div'); matWrap.style.marginTop='1.1rem';
    matWrap.innerHTML = `<div style="font-size:12px;font-weight:500;color:var(--text2);margin-bottom:.4rem">Materiais</div>`;
    if (!encAtual.materiais.length) {
      matWrap.innerHTML += `<p style="font-size:12.5px;color:var(--text3)">Nenhum material disponível para este encontro.</p>`;
    } else {
      const ml = document.createElement('div'); ml.className='mat-list';
      encAtual.materiais.forEach(mat=>{
        const ico = mat.tipo==='PDF'?'📄':mat.tipo==='PPTX'?'📊':mat.tipo==='VIDEO'?'🎬':'📎';
        const row = document.createElement('div'); row.className='mat-row';
        row.innerHTML = `<span style="font-size:15px">${ico}</span><div style="flex:1"><div style="font-size:13px">${mat.nome}</div>${mat.tamanho_kb?`<div style="font-size:11px;color:var(--text3)">${mat.tipo}·${fmtTam(mat.tamanho_kb)}</div>`:''}</div><a href="${mat.url}" target="_blank" class="btn btn-out btn-sm">↓ Baixar</a>`;
        ml.appendChild(row);
      });
      matWrap.appendChild(ml);
    }
    card.appendChild(matWrap);
    main.appendChild(card);
  }
  layout.appendChild(main);
  wrap.appendChild(layout);
  c.appendChild(wrap);
}

// ─── FREQUÊNCIA PÚBLICA ───
function renderFreqPublica(c) {
  const wrap=document.createElement('div'); wrap.className='page';
  const real=todosEncontros().filter(e=>e.realizado);
  wrap.innerHTML=`<div class="stats"><div class="stat"><div class="stat-l">Participantes</div><div class="stat-v">${discipulandos.length}</div></div><div class="stat"><div class="stat-l">Realizados</div><div class="stat-v">${real.length}</div><div class="stat-s">de ${todosEncontros().length}</div></div></div>`;
  if (!discipulandos.length) {
    wrap.innerHTML += `<div class="empty"><div class="empty-i">👤</div><p>Nenhum participante cadastrado.</p></div>`;
    c.appendChild(wrap); return;
  }
  const list=document.createElement('div'); list.className='pres-list';
  discipulandos.forEach((d,i)=>{
    const {pct,pres,total}=getFreq(d.id);
    const row=document.createElement('div'); row.className='pres-row';
    row.innerHTML=`${av(d.nome,i)}<div style="flex:1;min-width:0"><div class="pname">${d.nome}</div><div class="pfreq">${pres}/${total} presenças</div></div><span class="badge ${pct>=75?'bg-green':pct>=50?'bg-amber':'bg-red'}">${pct}%</span>`;
    list.appendChild(row);
  });
  wrap.appendChild(list); c.appendChild(wrap);
}

// ─── CHAMADA (admin) ───
function carregarChamadaParaEncontro(encId) {
  _chamadaAtual = new Map();
  discipulandos.forEach(d=>{
    const reg=chamadas.find(c=>c.encontro_id===encId&&c.discipulando_id===d.id);
    _chamadaAtual.set(d.id, reg!==undefined ? reg.presente : true);
  });
}
function mostrarUnsavedBar() {
  if (el('unsaved-bar')) return;
  const bar=document.createElement('div'); bar.className='unsaved-bar'; bar.id='unsaved-bar';
  bar.innerHTML=`<span>⚠️ Chamada não salva</span><button class="btn btn-sm" style="background:#fff;color:var(--amber);font-weight:600" id="btn-salvar-bar">Salvar agora</button>`;
  document.body.appendChild(bar);
  bar.querySelector('#btn-salvar-bar').addEventListener('click',()=>el('btn-salvar-chamada')?.click());
}
function removerUnsavedBar(){ el('unsaved-bar')?.remove(); }

function renderChamada(c) {
  const enc=todosEncontros();
  if(!_encSel && enc.length>0){_encSel=enc[0].id; carregarChamadaParaEncontro(_encSel);}
  const wrap=document.createElement('div'); wrap.className='page';
  if(!enc.length){wrap.innerHTML=`<div class="empty"><div class="empty-i">📋</div><p>Nenhum encontro cadastrado.<br>Vá em <b>Conteúdo</b> para criar.</p></div>`;c.appendChild(wrap);return;}

  const encAtual=enc.find(e=>e.id===_encSel);
  if (encAtual) el('page-actions').innerHTML = `<span class="badge ${encAtual.realizado?'bg-green':'bg-amber'}">${encAtual.realizado?'✓ Realizado':'Pendente'}</span>`;

  const presentes=[..._chamadaAtual.values()].filter(Boolean).length;
  const total=discipulandos.length;
  const pct=total?Math.round(presentes/total*100):0;
  wrap.innerHTML=`<div class="stats"><div class="stat"><div class="stat-l">Presentes</div><div class="stat-v" id="stat-pres">${presentes}</div><div class="stat-s">de ${total}</div></div><div class="stat"><div class="stat-l">Taxa</div><div class="stat-v" id="stat-pct">${pct}%</div></div></div>`;

  const layout=document.createElement('div'); layout.className='split-layout';
  const side=document.createElement('div'); side.className='split-side';
  let sHtml='';
  modulos.forEach(mod=>{
    if(!mod.encontros.length) return;
    sHtml+=`<div class="split-side-label">${mod.numero}. ${mod.titulo}</div>`;
    mod.encontros.forEach(e=>{
      const isActive=e.id===_encSel;
      const semChamada=!encontroTemChamada(e.id)&&!e.realizado;
      sHtml+=`<button class="lesson-list-btn${isActive?' active':''}${e.realizado?' done':''}" data-encid="${e.id}"><span class="lesson-status">${e.realizado?'✓':e.numero}</span><span style="flex:1">${e.titulo}${e.data?`<div style="font-size:10px;opacity:.6">${fmtData(e.data)}</div>`:''}</span>${semChamada?`<span style="font-size:10px;color:var(--amber)" title="Sem chamada registrada">!</span>`:''}</button>`;
    });
  });
  side.innerHTML=sHtml;
  side.querySelectorAll('[data-encid]').forEach(btn=>btn.addEventListener('click',async ()=>{
    if(_chamadaSuja){const ok=await confirmDialog('Chamada não salva. Trocar mesmo assim?');if(!ok)return;_chamadaSuja=false;removerUnsavedBar();}
    _encSel=btn.dataset.encid; carregarChamadaParaEncontro(_encSel); renderView('chamada');
  }));
  layout.appendChild(side);

  const main=document.createElement('div');
  if(!encAtual){main.innerHTML=`<div class="empty"><div class="empty-i">←</div><p>Selecione um encontro.</p></div>`;}
  else{
    const list=document.createElement('div'); list.className='pres-list'; list.id='pres-list';
    if(!discipulandos.length) list.innerHTML=`<div class="empty"><div class="empty-i">👤</div><p>Nenhum discipulando cadastrado.</p></div>`;
    discipulandos.forEach((d,i)=>{
      const presente=_chamadaAtual.get(d.id)===true;
      const {pct:fp}=getFreq(d.id);
      const row=document.createElement('div');
      row.className=`pres-row${fp<50&&fp>0?' freq-critica':fp<75&&fp>0?' freq-baixa':''}`;
      row.innerHTML=`${av(d.nome,i)}<div style="flex:1;min-width:0"><div class="pname">${d.nome}</div><div class="pfreq">Frequência: ${fp}%${fp<75&&fp>0?' ⚠️':''}</div></div><button class="tog ${presente?'tog-p':'tog-a'}" data-disc="${d.id}">${presente?'Presente':'Ausente'}</button>`;
      row.querySelector('[data-disc]').addEventListener('click',function(){
        const novo=!_chamadaAtual.get(d.id);
        _chamadaAtual.set(d.id,novo);
        this.className=`tog ${novo?'tog-p':'tog-a'}`; this.textContent=novo?'Presente':'Ausente';
        const p=[..._chamadaAtual.values()].filter(Boolean).length;
        el('stat-pres').textContent=p; el('stat-pct').textContent=(discipulandos.length?Math.round(p/discipulandos.length*100):0)+'%';
        _chamadaSuja=true; mostrarUnsavedBar();
      });
      list.appendChild(row);
    });
    main.appendChild(list);
    const footer=document.createElement('div'); footer.className='gap'; footer.style.marginTop='1rem';
    footer.innerHTML=`<button class="btn btn-acc" id="btn-salvar-chamada">✓ Salvar chamada</button>`;
    main.appendChild(footer);
    main.querySelector('#btn-salvar-chamada').addEventListener('click',async()=>{
      const btn=main.querySelector('#btn-salvar-chamada'); btn.textContent='Salvando...'; btn.disabled=true;
      try{
        const ups=discipulandos.map(d=>({encontro_id:_encSel,discipulando_id:d.id,presente:_chamadaAtual.get(d.id)===true}));
        await sb.from('chamadas').upsert(ups,{onConflict:'encontro_id,discipulando_id'});
        const encRef=enc.find(e=>e.id===_encSel);
        if(encRef&&!encRef.realizado) await sb.from('encontros').update({realizado:true}).eq('id',_encSel);
        await carregarDadosPublicos(); _chamadaSuja=false; removerUnsavedBar();
        notif('Chamada salva!');
        renderView('chamada');
      }catch(e){notif('Erro: '+e.message,'err'); btn.textContent='✓ Salvar chamada'; btn.disabled=false;}
    });
  }
  layout.appendChild(main); wrap.appendChild(layout); c.appendChild(wrap);
}

// ─── CONTEÚDO (admin) — módulos, encontros e materiais unificados ───
function renderConteudoAdm(c) {
  el('page-actions').innerHTML = `<button class="btn btn-acc btn-sm" id="btn-novo-mod">+ Novo módulo</button>`;
  el('btn-novo-mod').addEventListener('click',()=>abrirModalMod(null));

  const wrap=document.createElement('div'); wrap.className='page';
  if(!modulos.length){wrap.innerHTML=`<div class="empty"><div class="empty-i">📦</div><p>Nenhum módulo criado ainda.<br>Clique em <b>+ Novo módulo</b> para começar.</p></div>`;c.appendChild(wrap);return;}

  modulos.forEach(mod=>{
    const card=document.createElement('div'); card.className='adm-mod-card'; const open=_conteudoMod===mod.id;
    card.innerHTML=`<div class="adm-mod-head"><div style="width:28px;height:28px;border-radius:6px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0">${mod.numero}</div><span class="adm-mod-title">${mod.titulo}</span><span class="badge bg-gray">${mod.encontros.length} encontro(s)</span><div class="adm-actions" onclick="event.stopPropagation()"><button class="btn btn-out btn-sm btn-edit-mod">✏️</button><button class="btn btn-danger btn-sm btn-del-mod">🗑</button></div><span style="font-size:12px;color:var(--accent);margin-left:4px">${open?'▲':'▼'}</span></div>`;
    if(open){
      const body=document.createElement('div');
      if(!mod.encontros.length){const ne=document.createElement('div');ne.style.cssText='padding:.75rem 1.25rem;font-size:13px;color:var(--text3)';ne.textContent='Nenhum encontro ainda.';body.appendChild(ne);}
      mod.encontros.forEach(enc=>{
        const encOpen=_conteudoEnc===enc.id;
        const item=document.createElement('div'); item.className='enc-item';
        const head=document.createElement('div'); head.className='adm-enc-row'; head.style.cursor='pointer';
        head.innerHTML=`<div style="width:24px;height:24px;border-radius:5px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text2)">${enc.numero}</div><span class="adm-enc-name">${enc.titulo}</span>${enc.data?`<span style="font-size:11px;color:var(--text3)">${fmtData(enc.data)}</span>`:''}<span class="badge ${enc.realizado?'bg-green':'bg-gray'}">${enc.realizado?'Realizado':'Agendado'}</span><span class="badge bg-acc">${enc.materiais.length} arq.</span><div class="adm-actions" onclick="event.stopPropagation()"><button class="btn btn-out btn-sm btn-edit-enc">✏️</button><button class="btn btn-danger btn-sm btn-del-enc">🗑</button></div><span style="font-size:11px;color:var(--text3)">${encOpen?'▲':'▼'}</span>`;
        head.addEventListener('click',()=>{_conteudoEnc=_conteudoEnc===enc.id?null:enc.id;renderView('conteudo');});
        head.querySelector('.btn-edit-enc').addEventListener('click',e=>{e.stopPropagation();abrirModalEnc(enc,mod.id,enc.numero);});
        head.querySelector('.btn-del-enc').addEventListener('click',async e=>{
          e.stopPropagation();
          const ok=await confirmDialog('Excluir este encontro? Isso também remove os materiais e chamadas associadas.',{danger:true}); if(!ok)return;
          await sb.from('encontros').delete().eq('id',enc.id);
          await carregarDadosPublicos(); notif('Encontro excluído.'); renderView('conteudo');
        });
        item.appendChild(head);
        if(encOpen){
          const inner=document.createElement('div'); inner.className='enc-body-inner';
          if(enc.tema||enc.versiculo||enc.tarefa){
            const info=document.createElement('div'); info.style.cssText='background:var(--al);border-radius:var(--rs);padding:.6rem .9rem;margin-bottom:.6rem;font-size:12px;line-height:1.6';
            if(enc.tema) info.innerHTML+=`<div>📖 <b>Tema:</b> ${enc.tema}</div>`;
            if(enc.versiculo) info.innerHTML+=`<div>✝ <b>Versículo:</b> <em>${enc.versiculo}</em></div>`;
            if(enc.tarefa) info.innerHTML+=`<div>✏️ <b>Tarefa:</b> ${enc.tarefa}</div>`;
            inner.appendChild(info);
          }
          const ml=document.createElement('div'); ml.className='mat-list';
          if(!enc.materiais.length) ml.innerHTML=`<p style="font-size:12px;color:var(--text3);margin-bottom:.4rem">Nenhum material anexado.</p>`;
          enc.materiais.forEach(mat=>{
            const ico=mat.tipo==='PDF'?'📄':mat.tipo==='PPTX'?'📊':mat.tipo==='VIDEO'?'🎬':'📎';
            const row=document.createElement('div'); row.className='mat-row';
            row.innerHTML=`<span style="font-size:15px">${ico}</span><div style="flex:1"><div style="font-size:13px">${mat.nome}</div>${mat.tamanho_kb?`<div style="font-size:11px;color:var(--text3)">${mat.tipo}·${fmtTam(mat.tamanho_kb)}</div>`:''}</div><a href="${mat.url}" target="_blank" class="btn btn-out btn-sm">↓</a><button class="btn btn-danger btn-sm" data-delmat="${mat.id}">✕</button>`;
            row.querySelector('[data-delmat]').addEventListener('click',async()=>{
              const ok=await confirmDialog('Remover este material?',{danger:true}); if(!ok)return;
              await sb.from('materiais').delete().eq('id',mat.id);
              await carregarDadosPublicos(); notif('Material removido.'); renderView('conteudo');
            });
            ml.appendChild(row);
          });
          inner.appendChild(ml);
          const lbl=document.createElement('label'); lbl.className='btn btn-out btn-sm'; lbl.style.cssText='cursor:pointer;margin-top:8px;display:inline-flex';
          lbl.innerHTML=`+ Arquivo <input type="file" style="display:none" accept=".pdf,.pptx,.docx,.xlsx,.mp4,.zip">`;
          const inp=lbl.querySelector('input');
          inp.addEventListener('change',async e=>{
            const file=e.target.files[0]; if(!file)return;
            try{
              const safeName=sanitizePath(file.name);
              const path=`enc_${enc.id}/${Date.now()}_${safeName}`;
              const {error:ue}=await sb.storage.from('materiais').upload(path,file);
              if(ue) throw ue;
              const {data:{publicUrl}}=sb.storage.from('materiais').getPublicUrl(path);
              const tipo=file.name.split('.').pop().toUpperCase();
              await sb.from('materiais').insert({encontro_id:enc.id,nome:file.name,tipo,url:publicUrl,tamanho_kb:Math.round(file.size/1024)});
              await carregarDadosPublicos(); notif('Material adicionado!'); renderView('conteudo');
            }catch(err){notif('Erro no upload: '+err.message,'err');}
          });
          inner.appendChild(lbl);
          item.appendChild(inner);
        }
        body.appendChild(item);
      });
      const addEnc=document.createElement('div'); addEnc.className='adm-add-enc'; addEnc.innerHTML=`<button class="btn btn-out btn-sm btn-add-enc">+ Novo encontro</button>`; body.appendChild(addEnc); card.appendChild(body);
      card.querySelector('.btn-add-enc').addEventListener('click',e=>{e.stopPropagation();abrirModalEnc(null,mod.id,mod.encontros.length+1);});
    }
    card.querySelector('.adm-mod-head').addEventListener('click',()=>{_conteudoMod=_conteudoMod===mod.id?null:mod.id;_conteudoEnc=null;renderView('conteudo');});
    card.querySelector('.btn-edit-mod').addEventListener('click',e=>{e.stopPropagation();abrirModalMod(mod);});
    card.querySelector('.btn-del-mod').addEventListener('click',async e=>{
      e.stopPropagation();
      const ok=await confirmDialog(`Excluir o módulo "${mod.titulo}"? Isso remove também todos os encontros e materiais dele.`,{danger:true}); if(!ok)return;
      await sb.from('modulos').delete().eq('id',mod.id);
      await carregarDadosPublicos(); notif('Módulo excluído.'); renderView('conteudo');
    });
    wrap.appendChild(card);
  });
  c.appendChild(wrap);
}

function abrirModalMod(mod) {
  const isEdit=!!mod;
  const ow=document.createElement('div'); ow.className='overlay';
  ow.innerHTML=`<div class="modal"><div class="modal-t">${isEdit?'Editar módulo':'Novo módulo'}</div>
    <div class="fg"><label class="fl">Número</label><input class="fi" id="m-num" type="number" min="1" value="${isEdit?mod.numero:modulos.length+1}"></div>
    <div class="fg"><label class="fl">Título *</label><input class="fi" id="m-titulo" value="${isEdit?mod.titulo:''}"></div>
    <div class="fg"><label class="fl">Descrição</label><input class="fi" id="m-desc" value="${isEdit&&mod.descricao?mod.descricao:''}"></div>
    <div id="m-err" class="notif notif-err hide"></div>
    <div class="modal-f"><button class="btn btn-ghost" id="m-cancel">Cancelar</button><button class="btn btn-acc" id="m-save">${isEdit?'Salvar':'Criar'}</button></div></div>`;
  document.body.appendChild(ow);
  ow.addEventListener('click',e=>e.target===ow&&ow.remove());
  ow.querySelector('#m-cancel').onclick=()=>ow.remove();
  setTimeout(()=>ow.querySelector('#m-titulo').focus(),50);
  ow.querySelector('#m-save').onclick=async()=>{
    const titulo=ow.querySelector('#m-titulo').value.trim();
    const numero=parseInt(ow.querySelector('#m-num').value)||(modulos.length+1);
    const descricao=ow.querySelector('#m-desc').value.trim()||null;
    if(!titulo){ow.querySelector('#m-err').textContent='Informe o título.';ow.querySelector('#m-err').classList.remove('hide');return;}
    ow.querySelector('#m-save').textContent='Salvando...';
    if(isEdit){await sb.from('modulos').update({numero,titulo,descricao}).eq('id',mod.id);}
    else{const{data}=await sb.from('modulos').insert({numero,titulo,descricao,grupo_id:grupoAtual?.id}).select().single();if(data)_conteudoMod=data.id;}
    ow.remove(); await carregarDadosPublicos(); notif(isEdit?'Módulo atualizado!':'Módulo criado!'); renderView('conteudo');
  };
}

function abrirModalEnc(enc, modId, nextNum) {
  const isEdit=!!enc;
  const ow=document.createElement('div'); ow.className='overlay';
  ow.innerHTML=`<div class="modal modal-lg"><div class="modal-t">${isEdit?'Editar encontro':'Novo encontro'}</div>
    <div style="display:grid;grid-template-columns:80px 1fr;gap:.75rem">
      <div class="fg"><label class="fl">Nº</label><input class="fi" id="e-num" type="number" min="1" value="${isEdit?enc.numero:nextNum||1}"></div>
      <div class="fg"><label class="fl">Título *</label><input class="fi" id="e-titulo" value="${isEdit?enc.titulo:''}"></div>
    </div>
    <div class="fg"><label class="fl">Data</label><input class="fi" id="e-data" type="date" value="${isEdit&&enc.data?enc.data:''}"></div>
    <div class="fg"><label class="fl">Tema do encontro</label><input class="fi" id="e-tema" placeholder="Ex: A vida no Espírito" value="${isEdit&&enc.tema?enc.tema:''}"></div>
    <div class="fg"><label class="fl">Versículo central</label><input class="fi" id="e-versiculo" placeholder="Ex: João 3:16" value="${isEdit&&enc.versiculo?enc.versiculo:''}"></div>
    <div class="fg"><label class="fl">Tarefa da semana</label><input class="fi" id="e-tarefa" placeholder="Ex: Ler Romanos 8 e anotar 3 pontos" value="${isEdit&&enc.tarefa?enc.tarefa:''}"></div>
    <div class="fg"><label class="fl">Resumo / observações (privado)</label><textarea class="fi" id="e-resumo" placeholder="O que foi discutido, pontos importantes...">${isEdit&&enc.resumo?enc.resumo:''}</textarea></div>
    <div id="e-err" class="notif notif-err hide"></div>
    <div class="modal-f"><button class="btn btn-ghost" id="e-cancel">Cancelar</button><button class="btn btn-acc" id="e-save">${isEdit?'Salvar':'Criar'}</button></div></div>`;
  document.body.appendChild(ow);
  ow.addEventListener('click',e=>e.target===ow&&ow.remove());
  ow.querySelector('#e-cancel').onclick=()=>ow.remove();

function exportFreq(){
  const rows=discipulandos.map(d=>{const{pct,pres,total}=getFreq(d.id);return{'Nome':d.nome,'E-mail':d.email||'','Telefone':d.telefone||'','Presenças':pres,'Total':total,'Frequência':pct+'%','Situação':pct>=75?'Regular':pct>=50?'Atenção':'Irregular'};});
  const ws=XLSX.utils.json_to_sheet(rows); ws['!cols']=[{wch:26},{wch:26},{wch:14},{wch:10},{wch:8},{wch:12},{wch:12}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Frequência'); XLSX.writeFile(wb,'frequencia_geral.xlsx');
}
function exportFull(){
  const enc=todosEncontros().filter(e=>e.realizado).sort((a,b)=>a.numero-b.numero);
  const wb=XLSX.utils.book_new();
  const cab=['Nome',...enc.map(e=>`E${e.numero}`.slice(0,20)),'Total ✓','Freq.'];
  const rows=discipulandos.map(d=>{const obj={'Nome':d.nome};let p=0;enc.forEach(e=>{const ch=chamadas.find(c=>c.encontro_id===e.id&&c.discipulando_id===d.id);const v=ch?.presente?'P':'A';if(v==='P')p++;obj[`E${e.numero}`]=v;});obj['Total ✓']=p;obj['Freq.']=enc.length?Math.round(p/enc.length*100)+'%':'0%';return obj;});
  const ws1=XLSX.utils.json_to_sheet(rows,{header:cab}); ws1['!cols']=[{wch:24},...enc.map(()=>({wch:6})),{wch:9},{wch:8}]; XLSX.utils.book_append_sheet(wb,ws1,'Chamada');
  const rowsMat=[];
  modulos.forEach(m=>m.encontros.forEach(e=>e.materiais.forEach(mat=>{rowsMat.push({'Módulo':`${m.numero}. ${m.titulo}`,'Encontro':`${e.numero}. ${e.titulo}`,'Material':mat.nome,'Tipo':mat.tipo,'Link':mat.url});})));
  if(rowsMat.length){const ws2=XLSX.utils.json_to_sheet(rowsMat);XLSX.utils.book_append_sheet(wb,ws2,'Materiais');}
  const rowsRes=discipulandos.map(d=>{const{pct,pres,total}=getFreq(d.id);return{'Nome':d.nome,'Presenças':pres,'Faltas':total-pres,'Frequência':pct+'%','Situação':pct>=75?'Regular':pct>=50?'Atenção':'Irregular'};});
  const ws3=XLSX.utils.json_to_sheet(rowsRes); XLSX.utils.book_append_sheet(wb,ws3,'Resumo');
  XLSX.writeFile(wb,'relatorio_completo.xlsx');
}
</script>
