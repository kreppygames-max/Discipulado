<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F5F0;--card:#fff;--muted:#F0EDE6;
  --border:#E4E0D8;--border2:#C8C3BA;
  --text:#1A1816;--text2:#6B6560;--text3:#9E9890;
  --accent:#4A3F8C;--al:#EAE8F5;--ad:#332B6B;
  --green:#3B6D11;--gl:#EAF3DE;
  --amber:#854F0B;--ambl:#FAEEDA;
  --red:#A32D2D;--redl:#FCEBEB;
  --r:10px;--rl:16px;--rs:6px;
  --sh:0 1px 4px rgba(0,0,0,.07);
  --sh2:0 4px 16px rgba(0,0,0,.10);
  --topbar-h:54px;
}
/* DARK MODE */
[data-theme="dark"]{
  --bg:#151412;--card:#1E1C19;--muted:#252320;
  --border:#2E2B27;--border2:#3D3A34;
  --text:#F0EDE6;--text2:#9E9890;--text3:#6B6560;
  --accent:#7B6FCC;--al:#252240;--ad:#9B8FE8;
  --green:#6AAF36;--gl:#1A2E0D;
  --amber:#D4863A;--ambl:#2E1E08;
  --red:#D45555;--redl:#2E0F0F;
  --sh:0 1px 4px rgba(0,0,0,.3);
  --sh2:0 4px 16px rgba(0,0,0,.4);
}
html{font-size:15px}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
.hide{display:none!important}
.page{padding:1.5rem;max-width:900px;margin:0 auto}
.gap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* LOADING */
#loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem}
.spin{font-size:32px;color:var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* TOPBAR */
#topbar{background:var(--card);border-bottom:1px solid var(--border);height:var(--topbar-h);display:flex;align-items:center;padding:0 1.25rem;gap:10px;position:sticky;top:0;z-index:200;transition:background .2s,border-color .2s}
.brand{font-family:'Lora',serif;font-size:17px;font-weight:500}
.tbadge{font-size:11px;font-weight:500;background:var(--al);color:var(--accent);padding:2px 9px;border-radius:20px}
.tuser{font-size:12px;color:var(--text3);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-name{font-size:12px;font-weight:600;color:var(--accent);background:var(--al);padding:2px 9px;border-radius:20px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* DARK TOGGLE */
.dark-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:.15s;flex-shrink:0}
.dark-btn:hover{background:var(--border)}

/* NAV */
#nav-pub,#nav-adm{background:var(--card);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 .75rem;scrollbar-width:none;transition:background .2s}
#nav-pub::-webkit-scrollbar,#nav-adm::-webkit-scrollbar{display:none}
.ntab{padding:13px 12px;border:none;border-bottom:2px solid transparent;background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text2);cursor:pointer;white-space:nowrap;transition:.15s}
.ntab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.ntab:hover:not(.active){color:var(--text)}

/* HERO */
.hero{background:var(--accent);color:#fff;padding:2.5rem 1.5rem 2rem;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'✝';position:absolute;font-size:160px;opacity:.05;top:-10px;right:-10px;line-height:1;pointer-events:none}
.hero h1{font-family:'Lora',serif;font-size:26px;font-weight:400;margin-bottom:.4rem}
.hero p{font-size:14px;opacity:.75}

/* LOGIN / SETUP */
#login-screen,#setup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--bg)}
.login-card,.setup-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:2.5rem;max-width:380px;width:100%;box-shadow:var(--sh2)}
.login-logo{text-align:center;margin-bottom:2rem}
.login-logo .cross{font-size:30px;color:var(--accent);display:block;margin-bottom:.5rem}
.login-logo h2{font-family:'Lora',serif;font-size:19px;font-weight:500}
.login-logo p{font-size:13px;color:var(--text2);margin-top:3px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:1.25rem}
.stat{background:var(--muted);border-radius:var(--r);padding:.9rem 1rem;transition:background .2s}
.stat-l{font-size:11px;font-weight:500;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
.stat-v{font-size:24px;font-weight:600;line-height:1}
.stat-s{font-size:12px;color:var(--text2);margin-top:2px}

/* BOX / CARD */
.box{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:1.25rem;box-shadow:var(--sh);transition:background .2s,border-color .2s}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:8px}
.sh-t{font-family:'Lora',serif;font-size:16px;font-weight:500}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;text-decoration:none;transition:.15s;white-space:nowrap}
.btn-acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-acc:hover{background:var(--ad)}
.btn-out{background:transparent;border-color:var(--border2);color:var(--text2)}
.btn-out:hover{background:var(--muted);color:var(--text)}
.btn-ghost{background:transparent;color:var(--text2)}
.btn-ghost:hover{background:var(--muted)}
.btn-green{background:var(--gl);color:var(--green);border-color:#C0DD97}
.btn-green:hover{filter:brightness(.95)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-danger{background:var(--redl);color:var(--red);border-color:#F0B3B3}
.btn-danger:hover{filter:brightness(.95)}
.btn-full{width:100%;justify-content:center;padding:10px}

/* FORM */
.fg{margin-bottom:1rem}
.fl{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
.fi{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:14px;background:var(--card);color:var(--text);outline:none;transition:.15s}
.fi:focus{border-color:var(--accent)}
textarea.fi{resize:vertical;min-height:80px}
select.fi{cursor:pointer}

/* BADGES */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap}
.bg-green{background:var(--gl);color:var(--green)}
.bg-gray{background:var(--muted);color:var(--text2)}
.bg-acc{background:var(--al);color:var(--accent)}
.bg-amber{background:var(--ambl);color:var(--amber)}
.bg-red{background:var(--redl);color:var(--red)}

/* NOTIF */
.notif{border-radius:var(--rs);padding:9px 13px;font-size:13px;margin-bottom:1rem}
.notif-ok{background:var(--gl);color:var(--green);border:1px solid #C0DD97}
.notif-err{background:var(--redl);color:var(--red);border:1px solid #F0B3B3}

/* MODULES */
.mod-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh);transition:background .2s}
.mod-head{display:flex;align-items:center;gap:12px;padding:1rem 1.25rem;cursor:pointer;user-select:none;transition:.15s}
.mod-head:hover{background:var(--muted)}
.mod-num{width:34px;height:34px;border-radius:8px;background:var(--al);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;flex-shrink:0;font-family:'Lora',serif}
.mod-body{border-top:1px solid var(--border)}
.enc-item{border-bottom:1px solid var(--border)}
.enc-item:last-child{border-bottom:none}
.enc-head{display:flex;align-items:center;gap:10px;padding:.7rem 1.25rem;cursor:pointer;transition:.15s}
.enc-head:hover{background:var(--muted)}
.enc-num{width:26px;height:26px;border-radius:6px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--text2);flex-shrink:0}
.mat-list{padding:.5rem 1.25rem .75rem 3.5rem;display:flex;flex-direction:column;gap:6px}
.mat-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.mat-row:last-of-type{border-bottom:none}

/* ADMIN MODULE EDITOR */
.adm-mod-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.adm-mod-head{display:flex;align-items:center;gap:10px;padding:.85rem 1.25rem;background:var(--al);cursor:pointer;transition:.15s}
.adm-mod-head:hover{filter:brightness(.97)}
.adm-mod-title{font-size:14px;font-weight:500;flex:1;color:var(--accent)}
.adm-enc-row{display:flex;align-items:center;gap:10px;padding:.6rem 1.25rem;border-bottom:1px solid var(--border)}
.adm-enc-row:last-child{border-bottom:none}
.adm-enc-name{flex:1;font-size:13px}
.adm-add-enc{display:flex;align-items:center;gap:8px;padding:.6rem 1.25rem;background:var(--muted)}
.adm-actions{display:flex;gap:6px;align-items:center}

/* CHAMADA */
.chamada-layout{display:grid;grid-template-columns:260px 1fr;gap:1.25rem;align-items:start}
@media(max-width:660px){.chamada-layout{grid-template-columns:1fr}}
.chamada-sidebar{position:sticky;top:calc(var(--topbar-h) + 56px)}
.enc-sel-group-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:8px 0 4px}
.enc-sel-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r);border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;text-align:left;transition:.15s;width:100%;margin-bottom:4px}
.enc-sel-btn:hover{background:var(--muted)}
.enc-sel-btn.active{background:var(--al);border-color:var(--accent);color:var(--accent);font-weight:500}
.enc-sel-n{width:24px;height:24px;border-radius:5px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.enc-sel-btn.active .enc-sel-n{background:var(--accent);color:#fff}
.enc-no-chamada{border-left:3px solid var(--amber)}

/* PRESENÇA */
.pres-list{display:flex;flex-direction:column;gap:8px}
.pres-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;transition:.15s}
.pres-row.freq-baixa{border-left:3px solid var(--amber)}
.pres-row.freq-critica{border-left:3px solid var(--red)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
.pname{font-size:14px;font-weight:500}
.pfreq{font-size:11px;color:var(--text3)}
.tog{padding:5px 13px;border-radius:20px;border:1px solid;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;min-width:76px;text-align:center}
.tog-p{background:var(--gl);color:var(--green);border-color:#C0DD97}
.tog-a{background:var(--muted);color:var(--text2);border-color:var(--border2)}

/* FREQ BARS */
.fb-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.fb-name{font-size:13px;width:100px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-track{flex:1;height:7px;background:var(--muted);border-radius:4px;overflow:hidden}
.fb-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.fb-pct{font-size:12px;color:var(--text2);width:36px;text-align:right}

/* TABLE */
.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.dt td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.dt tr:last-child td{border-bottom:none}
.dt tr:hover td{background:var(--muted)}
.dt tr{cursor:pointer}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:500;padding:1rem;backdrop-filter:blur(2px)}
.modal{background:var(--card);border-radius:var(--rl);padding:1.5rem;width:100%;max-width:440px;box-shadow:0 12px 40px rgba(0,0,0,.2);animation:sup .2s ease;max-height:90vh;overflow-y:auto}
@keyframes sup{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-t{font-family:'Lora',serif;font-size:17px;font-weight:500;margin-bottom:1.25rem}
.modal-f{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem}
.modal-lg{max-width:600px}

/* EMPTY */
.empty{text-align:center;padding:3rem 1rem;color:var(--text2);font-size:14px}
.empty-i{font-size:36px;margin-bottom:.75rem;opacity:.35}

/* AVISO CARD (público) */
.aviso-card{background:var(--accent);color:#fff;border-radius:var(--rl);padding:1.5rem;margin-bottom:1.25rem;position:relative;overflow:hidden}
.aviso-card::before{content:'📢';position:absolute;font-size:80px;opacity:.08;right:-10px;bottom:-10px}
.aviso-card h3{font-family:'Lora',serif;font-size:18px;font-weight:500;margin-bottom:.75rem}
.aviso-detail{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.9;margin-bottom:.35rem}
.aviso-detail span{font-size:15px}
.aviso-versiculo{background:rgba(255,255,255,.15);border-radius:var(--rs);padding:.6rem .9rem;font-size:13px;font-style:italic;margin-top:.75rem;line-height:1.5}
.aviso-tarefa{background:rgba(255,255,255,.1);border-radius:var(--rs);padding:.6rem .9rem;font-size:13px;margin-top:.5rem}

/* ORAÇÃO CARD */
.oracao-row{display:flex;align-items:flex-start;gap:10px;padding:.75rem 0;border-bottom:1px solid var(--border)}
.oracao-row:last-child{border-bottom:none}
.oracao-check{width:20px;height:20px;border-radius:5px;border:2px solid var(--border2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;transition:.15s;margin-top:2px}
.oracao-check.done{background:var(--green);border-color:var(--green);color:#fff}
.oracao-txt{flex:1;font-size:13px;line-height:1.5}
.oracao-txt.done-txt{text-decoration:line-through;color:var(--text3)}

/* PERFIL DISC */
.perfil-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}
.perfil-info h2{font-family:'Lora',serif;font-size:20px;font-weight:500}
.perfil-info p{font-size:13px;color:var(--text2)}
.hist-row{display:flex;align-items:center;gap:10px;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:13px}
.hist-row:last-child{border-bottom:none}
.hist-enc{flex:1;color:var(--text2)}
.hist-badge{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}

/* SITUAÇÃO */
.sit-btn{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:2px solid transparent;transition:.15s}
.sit-ativo{background:var(--gl);color:var(--green)}
.sit-recem{background:var(--al);color:var(--accent)}
.sit-crescendo{background:var(--ambl);color:var(--amber)}
.sit-atencao{background:var(--redl);color:var(--red)}

/* CHART */
.chart-wrap{display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:.75rem;padding:0 4px}
.chart-bar-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:4px}
.chart-bar{width:100%;border-radius:4px 4px 0 0;transition:height .5s cubic-bezier(.4,0,.2,1);min-height:4px}
.chart-label{font-size:9px;color:var(--text3);text-align:center;white-space:nowrap;overflow:hidden;max-width:32px;text-overflow:ellipsis}

/* GRUPO SELECTOR */
.grupo-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:1.25rem;box-shadow:var(--sh);cursor:pointer;transition:.2s;display:flex;align-items:center;gap:1rem;margin-bottom:10px}
.grupo-card:hover{border-color:var(--accent);box-shadow:var(--sh2)}
.grupo-icon{width:42px;height:42px;border-radius:10px;background:var(--al);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

/* UNSAVED WARNING */
.unsaved-bar{position:fixed;bottom:0;left:0;right:0;background:var(--amber);color:#fff;padding:.6rem 1.25rem;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:500;z-index:300;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

@media(max-width:520px){
  .page{padding:1rem}
  .hero{padding:1.75rem 1rem 1.5rem}
  .hero h1{font-size:21px}
  .chamada-sidebar{position:static}
}
</style>
</head>
<body>

<div id="loading"><div class="spin">✝</div><p style="color:var(--text2)">Carregando...</p></div>

<div id="setup" class="hide">
  <div class="setup-card">
    <div style="text-align:center;margin-bottom:1.5rem"><span style="font-size:28px;color:var(--accent)">✝</span><h2 style="font-family:'Lora',serif;font-size:18px;margin-top:.5rem">Configure o Supabase</h2></div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:1rem">Preencha as chaves no topo do arquivo HTML:</p>
    <div style="background:var(--muted);border:1px solid var(--border);border-radius:var(--rs);padding:.75rem 1rem;font-family:monospace;font-size:11px;line-height:1.8;word-break:break-all">
      SUPABASE_URL = '<b style="color:var(--accent)">sua-url</b>'<br>SUPABASE_KEY = '<b style="color:var(--accent)">sua-key</b>'
    </div>
  </div>
</div>

<div id="login-screen" class="hide">
  <div class="login-card">
    <div class="login-logo"><span class="cross">✝</span><h2>Área do Discipulador</h2><p>Acesso restrito</p></div>
    <div class="fg"><label class="fl">E-mail</label><input class="fi" id="login-email" type="email" placeholder="seu@email.com"></div>
    <div class="fg"><label class="fl">Senha</label><input class="fi" id="login-senha" type="password" placeholder="••••••••"></div>
    <div id="login-err" class="notif notif-err hide"></div>
    <button class="btn btn-acc btn-full" id="login-btn">Entrar</button>
    <button class="btn btn-ghost btn-full" style="margin-top:8px" id="login-voltar">← Voltar</button>
  </div>
</div>

<div id="app" class="hide">
  <div id="topbar">
    <span style="font-size:18px;color:var(--accent)">✝</span>
    <span class="brand">Discipulado</span>
    <span class="tbadge" id="tb-badge">Público</span>
    <span class="group-name hide" id="tb-group"></span>
    <div style="flex:1"></div>
    <span class="tuser" id="tb-user"></span>
    <button class="dark-btn" id="dark-toggle" title="Modo escuro">🌙</button>
    <button class="btn btn-out btn-sm hide" id="btn-logout">Sair</button>
  </div>

  <div id="nav-pub" class="hide">
    <button class="ntab active" data-pub="inicio">Início</button>
    <button class="ntab" data-pub="materiais">Materiais</button>
    <button class="ntab" data-pub="frequencia">Frequência</button>
    <button class="ntab" id="nav-admin-btn" style="margin-left:auto;color:var(--text3)">Discipulador ↗</button>
  </div>

  <div id="nav-adm" class="hide">
    <button class="ntab active" data-adm="chamada">Chamada</button>
    <button class="ntab" data-adm="relatorios">Relatórios</button>
    <button class="ntab" data-adm="materiais-adm">Materiais</button>
    <button class="ntab" data-adm="estrutura">Módulos</button>
    <button class="ntab" data-adm="discipulandos">Discipulandos</button>
    <button class="ntab" data-adm="oracoes-adm">Oração</button>
    <button class="ntab" data-adm="avisos-adm">Avisos</button>
  </div>

  <div id="content"></div>
</div>

<script>
// ═══ ESTADO ═══
let sb, session = null;
let grupoAtual = null; // {id, nome, user_id}
let modulos = [], discipulandos = [], chamadas = [], avisos = [], oracoes = [];
let viewAtual = '';
let _chamadaAtual = new Map();
let _encSel = null;
let _modAberto = null, _encAberto = null;
let _estrutMod = null;
let _chamadaSuja = false; // flag unsaved

const CORES = [
  ['#EAE8F5','#4A3F8C'],['#EAF3DE','#3B6D11'],['#FAECE7','#993C1D'],
  ['#E6F1FB','#185FA5'],['#FAEEDA','#854F0B'],['#FBEAF0','#993556'],
  ['#fcebeb','#A32D2D'],['#E1F5EE','#085041'],['#F1EFE8','#5F5E5A'],
  ['#EAE8F5','#26215C'],['#FAECE7','#4A1B0C'],
];

const SITUACOES = {
  ativo: {label:'Ativo', cls:'sit-ativo'},
  recem_convertido: {label:'Recém convertido', cls:'sit-recem'},
  crescendo: {label:'Crescendo', cls:'sit-crescendo'},
  precisa_atencao: {label:'Precisa de atenção', cls:'sit-atencao'},
};

function av(nome, idx, sz=36) {
  const [bg,fg] = CORES[idx % CORES.length];
  const ini = (nome||'?').split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
  return `<div class="av" style="width:${sz}px;height:${sz}px;background:${bg};color:${fg};flex-shrink:0">${ini}</div>`;
}

// ═══ DARK MODE ═══
const darkBtn = document.getElementById('dark-toggle');
function applyTheme(dark){
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : '');
  darkBtn.textContent = dark ? '☀️' : '🌙';
  localStorage.setItem('theme', dark ? 'dark' : 'light');
}
darkBtn.addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') !== 'dark');
});
applyTheme(localStorage.getItem('theme') === 'dark');

// ═══ INIT ═══
window.addEventListener('DOMContentLoaded', async () => {
  if (!SUPABASE_URL || SUPABASE_URL.includes('COLE') || !SUPABASE_KEY || SUPABASE_KEY.includes('COLE')) {
    show('setup'); hide('loading'); return;
  }
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data } = await sb.auth.getSession();
    session = data.session;
    sb.auth.onAuthStateChange((_e, s) => { session = s; if(!s) { grupoAtual=null; } renderApp(); });
    await carregarDadosPublicos();
    hide('loading'); show('app');
    renderApp();
  } catch(e) {
    el('loading').innerHTML = `<div style="color:var(--red);font-size:32px">!</div><p style="color:var(--red);max-width:300px;text-align:center">Erro de conexão.<br>${e.message}</p>`;
  }
});

// ═══ DADOS ═══
async function carregarDadosPublicos() {
  // Sem grupo selecionado, carrega tudo (para tela pública genérica)
  const gid = grupoAtual?.id;
  const [r1, r2, r3, r4, r5] = await Promise.all([
    gid ? sb.from('modulos').select('*, encontros(*, materiais(*))').eq('grupo_id', gid).order('numero')
         : sb.from('modulos').select('*, encontros(*, materiais(*))').order('numero'),
    gid ? sb.from('discipulandos').select('*').eq('ativo', true).eq('grupo_id', gid).order('nome')
         : sb.from('discipulandos').select('*').eq('ativo', true).order('nome'),
    gid ? sb.from('chamadas').select('*')
         : sb.from('chamadas').select('*'),
    gid ? sb.from('avisos').select('*').eq('grupo_id', gid).eq('ativo', true).order('criado_em', {ascending:false})
         : sb.from('avisos').select('*').eq('ativo', true).order('criado_em', {ascending:false}),
    gid ? sb.from('oracoes').select('*').eq('grupo_id', gid).order('criado_em', {ascending:false})
         : sb.from('oracoes').select('*').order('criado_em', {ascending:false}),
  ]);
  modulos       = r1.data || [];
  discipulandos = r2.data || [];
  chamadas      = r3.data || [];
  avisos        = r4.data || [];
  oracoes       = r5.data || [];
  modulos.forEach(m => {
    m.encontros = (m.encontros||[]).sort((a,b)=>a.numero-b.numero);
    m.encontros.forEach(e => { e.materiais = e.materiais||[]; });
  });
}

async function carregarGrupoDoUser() {
  if (!session) return;
  const { data } = await sb.from('grupos').select('*').eq('user_id', session.user.id).order('criado_em');
  return data || [];
}

// ═══ HELPERS ═══
function show(id){ document.getElementById(id)?.classList.remove('hide') }
function hide(id){ document.getElementById(id)?.classList.add('hide') }
function el(id){ return document.getElementById(id) }
function todosEncontros(){ return modulos.flatMap(m => m.encontros.map(e=>({...e,mod_titulo:m.titulo,mod_numero:m.numero,mod_id:m.id}))); }

function getFreq(discId) {
  const enc = todosEncontros().filter(e=>e.realizado);
  const total = enc.length;
  if(!total) return {pct:0,pres:0,total:0};
  const pres = enc.filter(e=>chamadas.some(c=>c.encontro_id===e.id&&c.discipulando_id===discId&&c.presente)).length;
  return {pct:Math.round(pres/total*100),pres,total};
}

function fmtData(d){ if(!d)return''; return new Date(d+'T12:00:00').toLocaleDateString('pt-BR'); }
function fmtTam(kb){ if(!kb)return''; return kb>=1024?(kb/1024).toFixed(1)+' MB':kb+' KB'; }

function notif(msg, tipo='ok') {
  const n = document.createElement('div');
  n.className = `notif notif-${tipo}`;
  n.style.cssText='position:fixed;top:60px;right:1rem;z-index:400;box-shadow:var(--sh2);max-width:320px;animation:sup .2s ease';
  n.textContent = (tipo==='ok'?'✓ ':' ✗ ') + msg;
  document.body.appendChild(n);
  setTimeout(()=>n.remove(), 3500);
}

function sanitizePath(name) {
  return name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]/g,'_');
}

function encontroTemChamada(encId) {
  return chamadas.some(c => c.encontro_id === encId);
}

// ═══ APP ═══
function renderApp() {
  hide('nav-pub'); hide('nav-adm');
  el('btn-logout').classList.add('hide');
  el('tb-group').classList.add('hide');

  if (session) {
    el('tb-badge').textContent = 'Admin';
    el('tb-badge').style.background='var(--gl)'; el('tb-badge').style.color='var(--green)';
    el('tb-user').textContent = session.user.email;
    el('btn-logout').classList.remove('hide');
    show('nav-adm');
    if (grupoAtual) {
      el('tb-group').textContent = grupoAtual.nome;
      el('tb-group').classList.remove('hide');
    }
    if (!['chamada','relatorios','materiais-adm','discipulandos','estrutura','oracoes-adm','avisos-adm'].includes(viewAtual)) viewAtual = 'chamada';
    bindAdmNav();
    // Se não tem grupo selecionado, mostra seletor
    if (!grupoAtual) { renderGrupoSelector(); return; }
    renderView(viewAtual);
  } else {
    el('tb-badge').textContent = 'Público';
    el('tb-badge').style.background='var(--al)'; el('tb-badge').style.color='var(--accent)';
    el('tb-user').textContent = '';
    show('nav-pub');
    if (!['inicio','materiais','frequencia'].includes(viewAtual)) viewAtual = 'inicio';
    bindPubNav();
    renderView(viewAtual);
  }

  el('btn-logout').onclick = () => { grupoAtual=null; sb.auth.signOut(); };
  const adminBtn = el('nav-admin-btn');
  if (adminBtn) adminBtn.onclick = () => { hide('app'); show('login-screen'); };
}

function bindPubNav() {
  document.querySelectorAll('[data-pub]').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.pub===viewAtual);
    btn.onclick=()=>{ document.querySelectorAll('[data-pub]').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); viewAtual=btn.dataset.pub; renderView(viewAtual); };
  });
}
function bindAdmNav() {
  document.querySelectorAll('[data-adm]').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.adm===viewAtual);
    btn.onclick=()=>{
      if (_chamadaSuja && viewAtual==='chamada') { if(!confirm('Você tem alterações não salvas na chamada. Deseja sair mesmo assim?')) return; _chamadaSuja=false; removerUnsavedBar(); }
      document.querySelectorAll('[data-adm]').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); viewAtual=btn.dataset.adm; renderView(viewAtual);
    };
  });
}

el('login-btn').onclick = async () => {
  const email=el('login-email').value.trim(), senha=el('login-senha').value;
  el('login-err').classList.add('hide'); el('login-btn').textContent='Entrando...';
  const {error} = await sb.auth.signInWithPassword({email,password:senha});
  el('login-btn').textContent='Entrar';
  if(error){el('login-err').textContent='E-mail ou senha incorretos.';el('login-err').classList.remove('hide');}
  else { hide('login-screen'); show('app'); viewAtual='chamada'; await carregarDadosPublicos(); renderApp(); }
};
el('login-voltar').onclick=()=>{hide('login-screen');show('app');};
el('login-senha').addEventListener('keydown',e=>e.key==='Enter'&&el('login-btn').click());

// ═══ SELETOR DE GRUPO ═══
async function renderGrupoSelector() {
  const c = el('content');
  c.innerHTML = `<div class="page"><div class="sh"><span class="sh-t">Selecione ou crie seu grupo</span><button class="btn btn-acc btn-sm" id="btn-novo-grupo">+ Novo grupo</button></div><div id="grupos-lista"><div class="spin" style="display:block;text-align:center;padding:2rem;font-size:24px">✝</div></div></div>`;

  const grupos = await carregarGrupoDoUser();
  const lista = el('grupos-lista');

  if (!grupos.length) {
    lista.innerHTML = `<div class="empty"><div class="empty-i">🏠</div><p>Você ainda não tem nenhum grupo.<br>Clique em <b>+ Novo grupo</b> para criar.</p></div>`;
  } else {
    lista.innerHTML = '';
    grupos.forEach(g => {
      const card = document.createElement('div');
      card.className = 'grupo-card';
      card.innerHTML = `<div class="grupo-icon">🙏</div><div style="flex:1"><div style="font-size:15px;font-weight:500">${g.nome}</div>${g.descricao?`<div style="font-size:12px;color:var(--text2)">${g.descricao}</div>`:''}</div><span style="font-size:12px;color:var(--text3)">→</span>`;
      card.addEventListener('click', async () => {
        grupoAtual = g;
        el('tb-group').textContent = g.nome;
        el('tb-group').classList.remove('hide');
        await carregarDadosPublicos();
        _encSel = null; _chamadaAtual = new Map();
        renderView('chamada');
      });
      lista.appendChild(card);
    });
  }

  el('btn-novo-grupo').addEventListener('click', () => abrirModalGrupo());
}

function abrirModalGrupo() {
  const ow = document.createElement('div');
  ow.className = 'overlay';
  ow.innerHTML = `<div class="modal"><div class="modal-t">Novo grupo</div>
    <div class="fg"><label class="fl">Nome do grupo *</label><input class="fi" id="g-nome" placeholder="Ex: Discipulado Jovens 2025"></div>
    <div class="fg"><label class="fl">Descrição (opcional)</label><input class="fi" id="g-desc" placeholder="Ex: Grupo de jovens da célula Centro"></div>
    <div id="g-err" class="notif notif-err hide"></div>
    <div class="modal-f"><button class="btn btn-ghost" id="g-cancel">Cancelar</button><button class="btn btn-acc" id="g-save">Criar grupo</button></div>
  </div>`;
  document.body.appendChild(ow);
  ow.addEventListener('click',e=>e.target===ow&&ow.remove());
  ow.querySelector('#g-cancel').onclick=()=>ow.remove();
  setTimeout(()=>ow.querySelector('#g-nome').focus(),50);
  ow.querySelector('#g-save').onclick = async () => {
    const nome = ow.querySelector('#g-nome').value.trim();
    if(!nome){ow.querySelector('#g-err').textContent='Informe o nome.';ow.querySelector('#g-err').classList.remove('hide');return;}
    ow.querySelector('#g-save').textContent='Criando...';
    const {data,error} = await sb.from('grupos').insert({nome, descricao:ow.querySelector('#g-desc').value.trim()||null, user_id:session.user.id}).select().single();
    if(error){ow.querySelector('#g-err').textContent=error.message;ow.querySelector('#g-err').classList.remove('hide');ow.querySelector('#g-save').textContent='Criar grupo';return;}
    grupoAtual = data;
    el('tb-group').textContent = data.nome;
    el('tb-group').classList.remove('hide');
    ow.remove();
    await carregarDadosPublicos();
    renderView('chamada');
  };
}

// ═══ VIEWS ═══
function renderView(v) {
  viewAtual = v;
  const c = el('content');
  c.innerHTML = '';
  removerUnsavedBar();
  if(v==='inicio')        renderInicio(c);
  if(v==='materiais')     renderMateriais(c,false);
  if(v==='frequencia')    renderFreqPublica(c);
  if(v==='chamada')       renderChamada(c);
  if(v==='relatorios')    renderRelatorios(c);
  if(v==='materiais-adm') renderMateriais(c,true);
  if(v==='discipulandos') renderDiscipulandos(c);
  if(v==='estrutura')     renderEstrutura(c);
  if(v==='oracoes-adm')   renderOracoesAdm(c);
  if(v==='avisos-adm')    renderAvisosAdm(c);
}

// ─── INÍCIO PÚBLICO ───
function renderInicio(c) {
  c.innerHTML = `<div class="hero"><h1>Discipulado</h1><p>Bem-vindo ao grupo</p></div>`;
  const wrap = document.createElement('div');
  wrap.className = 'page';

  // Aviso ativo
  const avisosAtivos = avisos.filter(a=>a.ativo);
  if (avisosAtivos.length) {
    const a = avisosAtivos[0];
    const div = document.createElement('div');
    div.className = 'aviso-card';
    div.innerHTML = `<h3>${a.titulo}</h3>
      ${a.data_encontro?`<div class="aviso-detail"><span>📅</span><span>${fmtData(a.data_encontro)}</span></div>`:''}
      ${a.local?`<div class="aviso-detail"><span>📍</span><span>${a.local}</span></div>`:''}
      ${a.tema?`<div class="aviso-detail"><span>📖</span><span>${a.tema}</span></div>`:''}
      ${a.conteudo?`<div style="font-size:13px;margin-top:.5rem;opacity:.9">${a.conteudo}</div>`:''}
      ${a.versiculo?`<div class="aviso-versiculo">✝ ${a.versiculo}</div>`:''}
      ${a.tarefa?`<div class="aviso-tarefa">✏️ <b>Tarefa da semana:</b> ${a.tarefa}</div>`:''}`;
    wrap.appendChild(div);
  }

  // Pedidos de oração
  const ors = oracoes.filter(o=>!o.respondido).slice(0,5);
  if (ors.length) {
    const box = document.createElement('div');
    box.className = 'box';
    box.innerHTML = `<div class="sh" style="margin-bottom:.75rem"><span class="sh-t">🙏 Pedidos de oração</span></div>`;
    ors.forEach(o => {
      const row = document.createElement('div');
      row.className = 'oracao-row';
      row.innerHTML = `<div class="oracao-txt">${o.pedido}</div>`;
      box.appendChild(row);
    });
    wrap.appendChild(box);
  }

  if (!avisosAtivos.length && !ors.length) {
    wrap.innerHTML += `<div class="empty"><div class="empty-i">✝</div><p>Nenhum aviso ou pedido de oração no momento.</p></div>`;
  }

  c.appendChild(wrap);
}

// ─── MATERIAIS ───
function renderMateriais(c, isAdmin) {
  if(!isAdmin) c.innerHTML=`<div class="hero"><h1>Materiais</h1><p>Encontros e arquivos</p></div>`;
  const wrap=document.createElement('div'); wrap.className='page';
  wrap.appendChild(Object.assign(document.createElement('div'),{className:'sh',innerHTML:`<span class="sh-t">Módulos e materiais</span>`}));
  if(!modulos.length){wrap.innerHTML+=`<div class="empty"><div class="empty-i">📂</div><p>Nenhum material disponível.</p></div>`;}

  modulos.forEach(mod=>{
    const card=document.createElement('div'); card.className='mod-card';
    const enc_count=mod.encontros.length;
    card.innerHTML=`<div class="mod-head"><div class="mod-num">${mod.numero}</div><div style="flex:1"><div style="font-size:14px;font-weight:500">${mod.titulo}</div>${mod.descricao?`<div style="font-size:12px;color:var(--text3)">${mod.descricao}</div>`:''}</div><span class="badge bg-gray">${enc_count} enc.</span><span style="font-size:11px;color:var(--text3);margin-left:8px">${_modAberto===mod.id?'▲':'▼'}</span></div>`;
    if(_modAberto===mod.id){
      const body=document.createElement('div'); body.className='mod-body';
      mod.encontros.forEach(enc=>{
        const eitem=document.createElement('div'); eitem.className='enc-item';
        eitem.innerHTML=`<div class="enc-head"><div class="enc-num">${enc.numero}</div><div style="flex:1"><div style="font-size:13px">${enc.titulo}</div>${enc.data?`<div style="font-size:11px;color:var(--text3)">${fmtData(enc.data)}</div>`:''}</div><span class="badge ${enc.realizado?'bg-green':'bg-gray'}">${enc.realizado?'Realizado':'Agendado'}</span><span style="font-size:11px;color:var(--text3);margin-left:8px">${_encAberto===enc.id?'▲':'▼'}</span></div>`;
        if(_encAberto===enc.id){
          const ml=document.createElement('div'); ml.className='mat-list';
          // Versículo/tema/tarefa públicos
          if(enc.versiculo||enc.tema||enc.tarefa){
            const info=document.createElement('div'); info.style.cssText='background:var(--al);border-radius:var(--rs);padding:.6rem .9rem;margin-bottom:.5rem;font-size:12px;line-height:1.6';
            if(enc.tema) info.innerHTML+=`<div>📖 <b>Tema:</b> ${enc.tema}</div>`;
            if(enc.versiculo) info.innerHTML+=`<div>✝ <b>Versículo:</b> <em>${enc.versiculo}</em></div>`;
            if(enc.tarefa) info.innerHTML+=`<div>✏️ <b>Tarefa:</b> ${enc.tarefa}</div>`;
            ml.appendChild(info);
          }
          if(!enc.materiais.length) ml.innerHTML+=`<p style="font-size:12px;color:var(--text3)">Nenhum material.</p>`;
          enc.materiais.forEach(mat=>{
            const ico=mat.tipo==='PDF'?'📄':mat.tipo==='PPTX'?'📊':mat.tipo==='VIDEO'?'🎬':'📎';
            const row=document.createElement('div'); row.className='mat-row';
            row.innerHTML=`<span style="font-size:15px">${ico}</span><div style="flex:1"><div style="font-size:13px">${mat.nome}</div>${mat.tamanho_kb?`<div style="font-size:11px;color:var(--text3)">${mat.tipo}·${fmtTam(mat.tamanho_kb)}</div>`:''}</div><a href="${mat.url}" target="_blank" class="btn btn-out btn-sm">↓ Baixar</a>${isAdmin?`<button class="btn btn-danger btn-sm" data-del="${mat.id}">✕</button>`:''}`;
            ml.appendChild(row);
          });
          if(isAdmin){
            const lbl=document.createElement('label'); lbl.className='btn btn-out btn-sm'; lbl.style.cssText='cursor:pointer;margin-top:4px';
            lbl.innerHTML=`+ Arquivo <input type="file" style="display:none" accept=".pdf,.pptx,.docx,.xlsx,.mp4,.zip" data-encid="${enc.id}">`;
            ml.appendChild(lbl);
          }
          eitem.appendChild(ml);
        }
        body.appendChild(eitem);
        eitem.querySelector('.enc-head').addEventListener('click',()=>{_encAberto=_encAberto===enc.id?null:enc.id;renderView(viewAtual);});
        if(isAdmin){
          eitem.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click',async e=>{e.stopPropagation();if(!confirm('Remover?'))return;await sb.from('materiais').delete().eq('id',btn.dataset.del);await carregarDadosPublicos();renderView(viewAtual);}));
          const inp=eitem.querySelector('input[data-encid]');
          if(inp) inp.addEventListener('change',async e=>{
            const file=e.target.files[0]; if(!file)return;
            const eid=inp.dataset.encid;
            try{
              const safeName=sanitizePath(file.name);
              const path=`enc_${eid}/${Date.now()}_${safeName}`;
              const {error:ue}=await sb.storage.from('materiais').upload(path,file);
              if(ue) throw ue;
              const {data:{publicUrl}}=sb.storage.from('materiais').getPublicUrl(path);
              const tipo=file.name.split('.').pop().toUpperCase();
              await sb.from('materiais').insert({encontro_id:eid,nome:file.name,tipo,url:publicUrl,tamanho_kb:Math.round(file.size/1024)});
              await carregarDadosPublicos(); notif('Material adicionado!'); renderView(viewAtual);
            }catch(err){notif('Erro no upload: '+err.message,'err');}
          });
        }
      });
      card.appendChild(body);
    }
    card.querySelector('.mod-head').addEventListener('click',()=>{_modAberto=_modAberto===mod.id?null:mod.id;_encAberto=null;renderView(viewAtual);});
    wrap.appendChild(card);
  });
  c.appendChild(wrap);
}

// ─── FREQUÊNCIA PÚBLICA ───
function renderFreqPublica(c) {
  c.innerHTML=`<div class="hero"><h1>Frequência</h1><p>Presença do grupo</p></div>`;
  const wrap=document.createElement('div'); wrap.className='page';
  const real=todosEncontros().filter(e=>e.realizado);

// ─── CHAMADA ───
function carregarChamadaParaEncontro(encId) {
  _chamadaAtual = new Map();
  discipulandos.forEach(d=>{
    const reg=chamadas.find(c=>c.encontro_id===encId&&c.discipulando_id===d.id);
    _chamadaAtual.set(d.id, reg!==undefined ? reg.presente : true);
  });
}

function mostrarUnsavedBar() {
  if (el('unsaved-bar')) return;
  const bar=document.createElement('div'); bar.className='unsaved-bar'; bar.id='unsaved-bar';
  bar.innerHTML=`<span>⚠️ Chamada não salva</span><button class="btn btn-sm" style="background:#fff;color:var(--amber);font-weight:600" id="btn-salvar-bar">Salvar agora</button>`;
  document.body.appendChild(bar);
  bar.querySelector('#btn-salvar-bar').addEventListener('click',()=>el('btn-salvar-chamada')?.click());
}
function removerUnsavedBar(){ el('unsaved-bar')?.remove(); }

function renderChamada(c) {
  const enc=todosEncontros();
  if(!_encSel&&enc.length>0){_encSel=enc[0].id; carregarChamadaParaEncontro(_encSel);}
  const wrap=document.createElement('div'); wrap.className='page';
  if(!enc.length){wrap.innerHTML=`<div class="empty"><div class="empty-i">📋</div><p>Nenhum encontro cadastrado.<br>Vá em <b>Módulos</b> para criar.</p></div>`;c.appendChild(wrap);return;}

  const encAtual=enc.find(e=>e.id===_encSel);
  const presentes=[..._chamadaAtual.values()].filter(Boolean).length;
  const total=discipulandos.length;
  const pct=total?Math.round(presentes/total*100):0;

  wrap.innerHTML=`<div class="sh" style="margin-bottom:.75rem"><span class="sh-t">Chamada</span>${encAtual?`<span class="badge ${encAtual.realizado?'bg-green':'bg-amber'}">${encAtual.realizado?'✓ Realizado':'Pendente'}</span>`:''}</div>
    <div class="stats"><div class="stat"><div class="stat-l">Presentes</div><div class="stat-v" id="stat-pres">${presentes}</div><div class="stat-s">de ${total}</div></div><div class="stat"><div class="stat-l">Taxa</div><div class="stat-v" id="stat-pct">${pct}%</div></div></div>`;

  const layout=document.createElement('div'); layout.className='chamada-layout';

  // Sidebar de encontros
  const sidebar=document.createElement('div'); sidebar.className='chamada-sidebar';
  let sHtml=`<div style="font-size:12px;font-weight:500;color:var(--text2);margin-bottom:.5rem">Selecionar encontro</div>`;
  modulos.forEach(mod=>{
    sHtml+=`<div class="enc-sel-group-label">${mod.numero}. ${mod.titulo}</div>`;
    mod.encontros.forEach(e=>{
      const isActive=e.id===_encSel;
      const semChamada=!encontroTemChamada(e.id)&&!e.realizado;
      sHtml+=`<button class="enc-sel-btn${isActive?' active':''}${semChamada?' enc-no-chamada':''}" data-encid="${e.id}"><div class="enc-sel-n">${e.numero}</div><div style="flex:1;text-align:left"><div>${e.titulo}</div>${e.data?`<div style="font-size:10px;opacity:.6">${fmtData(e.data)}</div>`:''}</div>${e.realizado?`<span style="font-size:10px;color:var(--green)">✓</span>`:(semChamada?`<span style="font-size:10px;color:var(--amber)" title="Sem chamada">!</span>`:'')}</button>`;
    });
  });
  sidebar.innerHTML=sHtml;
  sidebar.querySelectorAll('[data-encid]').forEach(btn=>btn.addEventListener('click',()=>{
    if(_chamadaSuja){if(!confirm('Chamada não salva. Trocar mesmo assim?')){return;} _chamadaSuja=false; removerUnsavedBar();}
    _encSel=btn.dataset.encid; carregarChamadaParaEncontro(_encSel); renderView('chamada');
  }));
  layout.appendChild(sidebar);

  // Painel principal
  const main=document.createElement('div');
  if(!encAtual){main.innerHTML=`<div class="empty"><div class="empty-i">←</div><p>Selecione um encontro.</p></div>`;}
  else{
    const list=document.createElement('div'); list.className='pres-list'; list.id='pres-list';
    if(!discipulandos.length) list.innerHTML=`<div class="empty"><div class="empty-i">👤</div><p>Nenhum discipulando cadastrado.</p></div>`;
    discipulandos.forEach((d,i)=>{
      const presente=_chamadaAtual.get(d.id)===true;
      const {pct:fp}=getFreq(d.id);
      const row=document.createElement('div');
      row.className=`pres-row${fp<50&&fp>0?' freq-critica':fp<75&&fp>0?' freq-baixa':''}`;
      row.innerHTML=`${av(d.nome,i)}<div style="flex:1;min-width:0"><div class="pname">${d.nome}</div><div class="pfreq">Frequência: ${fp}%${fp<75&&fp>0?' ⚠️':''}</div></div><button class="tog ${presente?'tog-p':'tog-a'}" data-disc="${d.id}">${presente?'Presente':'Ausente'}</button>`;
      row.querySelector('[data-disc]').addEventListener('click',function(){
        const novo=!_chamadaAtual.get(d.id);
        _chamadaAtual.set(d.id,novo);
        this.className=`tog ${novo?'tog-p':'tog-a'}`; this.textContent=novo?'Presente':'Ausente';
        const p=[..._chamadaAtual.values()].filter(Boolean).length;
        el('stat-pres').textContent=p; el('stat-pct').textContent=Math.round(p/discipulandos.length*100)+'%';
        _chamadaSuja=true; mostrarUnsavedBar();
      });
      list.appendChild(row);
    });
    main.appendChild(list);
    const footer=document.createElement('div'); footer.className='gap'; footer.style.marginTop='1rem';
    footer.innerHTML=`<button class="btn btn-acc" id="btn-salvar-chamada">✓ Salvar chamada</button>`;
    main.appendChild(footer);
    main.querySelector('#btn-salvar-chamada').addEventListener('click',async()=>{
      const btn=main.querySelector('#btn-salvar-chamada'); btn.textContent='Salvando...'; btn.disabled=true;
      try{
        const ups=discipulandos.map(d=>({encontro_id:_encSel,discipulando_id:d.id,presente:_chamadaAtual.get(d.id)===true}));
        await sb.from('chamadas').upsert(ups,{onConflict:'encontro_id,discipulando_id'});
        const encRef=enc.find(e=>e.id===_encSel);
        if(encRef&&!encRef.realizado) await sb.from('encontros').update({realizado:true}).eq('id',_encSel);
        await carregarDadosPublicos(); _chamadaSuja=false; removerUnsavedBar();
        notif('Chamada salva!'); btn.textContent='✓ Salvar chamada'; btn.disabled=false;
      }catch(e){notif('Erro: '+e.message,'err'); btn.textContent='✓ Salvar chamada'; btn.disabled=false;}
    });
  }
  layout.appendChild(main); wrap.appendChild(layout); c.appendChild(wrap);
}

      card.querySelectorAll('.btn-del-enc').forEach(btn=>btn.addEventListener('click',async e=>{e.stopPropagation();if(!confirm('Excluir encontro?'))return;await sb.from('encontros').delete().eq('id',btn.dataset.eid);await carregarDadosPublicos();notif('Encontro excluído.');renderView('estrutura');}));

    const descricao=ow.querySelector('#m-desc').value.trim()||null;

  document.body.appendChild(ow);
  ow.addEventListener('click',e=>e.target===ow&&ow.remove());
  ow.querySelector('#d-cancel').onclick=()=>ow.remove();
  setTimeout(()=>ow.querySelector('#d-nome').focus(),50);
  ow.querySelector('#d-save').onclick=async()=>{
    const nome=ow.querySelector('#d-nome').value.trim();
    if(!nome){ow.querySelector('#d-err').textContent='Informe o nome.';ow.querySelector('#d-err').classList.remove('hide');return;}
    ow.querySelector('#d-save').textContent='Salvando...';
    const payload={nome,email:ow.querySelector('#d-email').value.trim()||null,telefone:ow.querySelector('#d-tel').value.trim()||null};
    let error;
    if(isEdit){({error}=await sb.from('discipulandos').update(payload).eq('id',disc.id));}
    else{({error}=await sb.from('discipulandos').insert({...payload,grupo_id:grupoAtual?.id}))}
    if(error){ow.querySelector('#d-err').textContent=error.message;ow.querySelector('#d-err').classList.remove('hide');ow.querySelector('#d-save').textContent='Salvar';return;}
    ow.remove(); await carregarDadosPublicos(); notif(isEdit?'Atualizado!':'Adicionado!'); renderView('discipulandos');
  };
}

// ─── ORAÇÕES (admin) ───
function renderOracoesAdm(c) {
  const wrap=document.createElement('div'); wrap.className='page';
  const sh=document.createElement('div'); sh.className='sh'; sh.innerHTML=`<span class="sh-t">Pedidos de Oração</span>`;
  const addBtn=document.createElement('button'); addBtn.className='btn btn-acc btn-sm'; addBtn.textContent='+ Novo pedido'; sh.appendChild(addBtn); wrap.appendChild(sh);
  if(!oracoes.length){wrap.innerHTML+=`<div class="empty"><div class="empty-i">🙏</div><p>Nenhum pedido cadastrado.</p></div>`;}
  const pendentes=oracoes.filter(o=>!o.respondido);
  const respondidos=oracoes.filter(o=>o.respondido);
  if(pendentes.length){
    const box=document.createElement('div'); box.className='box'; box.style.marginBottom='1rem';
    box.innerHTML=`<div class="sh" style="margin-bottom:.5rem"><span class="sh-t" style="font-size:14px">Pendentes (${pendentes.length})</span></div>`;
    pendentes.forEach(o=>{
      const row=document.createElement('div'); row.className='oracao-row';
      row.innerHTML=`<div class="oracao-check" id="chk-${o.id}">—</div><div style="flex:1"><div class="oracao-txt">${o.pedido}</div><div style="font-size:11px;color:var(--text3);margin-top:2px">${new Date(o.criado_em).toLocaleDateString('pt-BR')}</div></div><button class="btn btn-danger btn-sm" data-del="${o.id}">✕</button>`;
      const chk=row.querySelector(`#chk-${o.id}`);
      chk.addEventListener('click',async()=>{await sb.from('oracoes').update({respondido:true}).eq('id',o.id);await carregarDadosPublicos();notif('Marcado como respondido! 🙌');renderView('oracoes-adm');});
      row.querySelector('[data-del]').addEventListener('click',async()=>{if(!confirm('Excluir pedido?'))return;await sb.from('oracoes').delete().eq('id',o.id);await carregarDadosPublicos();renderView('oracoes-adm');});
      box.appendChild(row);
    });
    wrap.appendChild(box);
  }
  if(respondidos.length){
    const box=document.createElement('div'); box.className='box';
    box.innerHTML=`<div class="sh" style="margin-bottom:.5rem"><span class="sh-t" style="font-size:14px">Respondidos 🙌 (${respondidos.length})</span></div>`;
    respondidos.slice(0,10).forEach(o=>{
      const row=document.createElement('div'); row.className='oracao-row';
      row.innerHTML=`<div class="oracao-check done">✓</div><div style="flex:1"><div class="oracao-txt done-txt">${o.pedido}</div></div><button class="btn btn-danger btn-sm" data-del="${o.id}">✕</button>`;
      row.querySelector('[data-del]').addEventListener('click',async()=>{if(!confirm('Excluir?'))return;await sb.from('oracoes').delete().eq('id',o.id);await carregarDadosPublicos();renderView('oracoes-adm');});
      box.appendChild(row);
    });
    wrap.appendChild(box);
  }
  c.appendChild(wrap);
  addBtn.addEventListener('click',()=>abrirModalOracao());
}

function abrirModalOracao() {
  const ow=document.createElement('div'); ow.className='overlay';
  ow.innerHTML=`<div class="modal"><div class="modal-t">Novo pedido de oração</div>
    <div class="fg"><label class="fl">Pedido *</label><textarea class="fi" id="or-pedido" placeholder="Descreva o pedido de oração..." style="min-height:100px"></textarea></div>
    <div id="or-err" class="notif notif-err hide"></div>
    <div class="modal-f"><button class="btn btn-ghost" id="or-cancel">Cancelar</button><button class="btn btn-acc" id="or-save">Adicionar</button></div></div>`;
  document.body.appendChild(ow);
  ow.addEventListener('click',e=>e.target===ow&&ow.remove());
  ow.querySelector('#or-cancel').onclick=()=>ow.remove();
  setTimeout(()=>ow.querySelector('#or-pedido').focus(),50);
  ow.querySelector('#or-save').onclick=async()=>{
    const pedido=ow.querySelector('#or-pedido').value.trim();
    if(!pedido){ow.querySelector('#or-err').textContent='Informe o pedido.';ow.querySelector('#or-err').classList.remove('hide');return;}
    ow.querySelector('#or-save').textContent='Salvando...';
    await sb.from('oracoes').insert({pedido,grupo_id:grupoAtual?.id});
    ow.remove(); await carregarDadosPublicos(); notif('Pedido adicionado!'); renderView('oracoes-adm');
  };
}

// ─── AVISOS (admin) ───
function renderAvisosAdm(c) {
  const wrap=document.createElement('div'); wrap.className='page';
  const sh=document.createElement('div'); sh.className='sh'; sh.innerHTML=`<span class="sh-t">Avisos & Próximo encontro</span>`;
  const addBtn=document.createElement('button'); addBtn.className='btn btn-acc btn-sm'; addBtn.textContent='+ Novo aviso'; sh.appendChild(addBtn); wrap.appendChild(sh);
  if(!avisos.length){wrap.innerHTML+=`<div class="empty"><div class="empty-i">📢</div><p>Nenhum aviso publicado.</p></div>`;}
  avisos.forEach(a=>{
    const card=document.createElement('div'); card.className='box'; card.style.marginBottom='10px';
    card.innerHTML=`<div class="sh" style="margin-bottom:.5rem"><span style="font-size:14px;font-weight:500">${a.titulo}</span><div class="gap"><span class="badge ${a.ativo?'bg-green':'bg-gray'}">${a.ativo?'Ativo':'Inativo'}</span><button class="btn btn-out btn-sm btn-edit-av" data-id="${a.id}">✏️ Editar</button><button class="btn btn-danger btn-sm btn-del-av" data-id="${a.id}">🗑</button></div></div>${a.data_encontro?`<div style="font-size:13px;color:var(--text2)">📅 ${fmtData(a.data_encontro)}</div>`:''} ${a.local?`<div style="font-size:13px;color:var(--text2)">📍 ${a.local}</div>`:''} ${a.tema?`<div style="font-size:13px;color:var(--text2)">📖 ${a.tema}</div>`:''}`;
    card.querySelector('.btn-edit-av').addEventListener('click',()=>abrirModalAviso(a));
    card.querySelector('.btn-del-av').addEventListener('click',async()=>{if(!confirm('Excluir aviso?'))return;await sb.from('avisos').delete().eq('id',a.id);await carregarDadosPublicos();renderView('avisos-adm');});
    wrap.appendChild(card);
  });
  c.appendChild(wrap);
  addBtn.addEventListener('click',()=>abrirModalAviso(null));
}

function abrirModalAviso(av) {
  const isEdit=!!av;
  const ow=document.createElement('div'); ow.className='overlay';
  ow.innerHTML=`<div class="modal modal-lg"><div class="modal-t">${isEdit?'Editar aviso':'Novo aviso'}</div>
    <div class="fg"><label class="fl">Título *</label><input class="fi" id="av-titulo" value="${isEdit?av.titulo:''}" placeholder="Ex: Próximo encontro"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
      <div class="fg"><label class="fl">Data do encontro</label><input class="fi" id="av-data" type="date" value="${isEdit&&av.data_encontro?av.data_encontro:''}"></div>
      <div class="fg"><label class="fl">Local</label><input class="fi" id="av-local" value="${isEdit&&av.local?av.local:''}" placeholder="Casa do João / Online"></div>
    </div>
    <div class="fg"><label class="fl">Tema</label><input class="fi" id="av-tema" value="${isEdit&&av.tema?av.tema:''}" placeholder="Tema do encontro"></div>
    <div class="fg"><label class="fl">Conteúdo / recado</label><textarea class="fi" id="av-conteudo" placeholder="Mensagem para o grupo...">${isEdit&&av.conteudo?av.conteudo:''}</textarea></div>
    <div class="fg"><label class="fl">Versículo</label><input class="fi" id="av-versiculo" value="${isEdit&&av.versiculo?av.versiculo:''}" placeholder="João 3:16 — ..."></div>
    <div class="fg"><label class="fl">Tarefa da semana</label><input class="fi" id="av-tarefa" value="${isEdit&&av.tarefa?av.tarefa:''}" placeholder="Leitura, exercício..."></div>
    <div class="fg" style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="av-ativo" ${!isEdit||av.ativo?'checked':''}><label for="av-ativo" style="font-size:13px;cursor:pointer">Publicar (visível para o grupo)</label></div>
    <div id="av-err" class="notif notif-err hide"></div>
    <div class="modal-f"><button class="btn btn-ghost" id="av-cancel">Cancelar</button><button class="btn btn-acc" id="av-save">${isEdit?'Salvar':'Publicar'}</button></div></div>`;
  document.body.appendChild(ow);
  ow.addEventListener('click',e=>e.target===ow&&ow.remove());
  ow.querySelector('#av-cancel').onclick=()=>ow.remove();
  setTimeout(()=>ow.querySelector('#av-titulo').focus(),50);
  ow.querySelector('#av-save').onclick=async()=>{
    const titulo=ow.querySelector('#av-titulo').value.trim();
    if(!titulo){ow.querySelector('#av-err').textContent='Informe o título.';ow.querySelector('#av-err').classList.remove('hide');return;}
    const payload={titulo,data_encontro:ow.querySelector('#av-data').value||null,local:ow.querySelector('#av-local').value.trim()||null,tema:ow.querySelector('#av-tema').value.trim()||null,conteudo:ow.querySelector('#av-conteudo').value.trim()||null,versiculo:ow.querySelector('#av-versiculo').value.trim()||null,tarefa:ow.querySelector('#av-tarefa').value.trim()||null,ativo:ow.querySelector('#av-ativo').checked};
    ow.querySelector('#av-save').textContent='Salvando...';
    if(isEdit){await sb.from('avisos').update(payload).eq('id',av.id);}
    else{await sb.from('avisos').insert({...payload,grupo_id:grupoAtual?.id});}
    ow.remove(); await carregarDadosPublicos(); notif(isEdit?'Aviso atualizado!':'Aviso publicado!'); renderView('avisos-adm');
  };
}

// ─── RELATÓRIOS ───
function renderRelatorios(c) {
  const wrap=document.createElement('div'); wrap.className='page';
  const real=todosEncontros().filter(e=>e.realizado);
  wrap.innerHTML=`<div class="sh"><span class="sh-t">Relatórios</span></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:1.5rem">
      <div class="box exp-card" style="flex-direction:column;gap:.5rem"><div><div style="font-size:14px;font-weight:500">Frequência geral</div><div style="font-size:12px;color:var(--text2)">Presenças, faltas e percentual por pessoa.</div></div><button class="btn btn-acc btn-sm" id="btn-exp-freq" style="align-self:flex-start">↓ Baixar .xlsx</button></div>
      <div class="box exp-card" style="flex-direction:column;gap:.5rem"><div><div style="font-size:14px;font-weight:500">Relatório completo</div><div style="font-size:12px;color:var(--text2)">3 abas: chamada, materiais e resumo.</div></div><button class="btn btn-acc btn-sm" id="btn-exp-full" style="align-self:flex-start">↓ Baixar .xlsx</button></div>
    </div>
    <div class="sh"><span class="sh-t">Evolução de presença</span></div>`;

  // Gráfico de barras por encontro
  const enc=todosEncontros().filter(e=>e.realizado);
  if(enc.length){
    const chartWrap=document.createElement('div'); chartWrap.className='box'; chartWrap.style.marginBottom='1.25rem';
    chartWrap.innerHTML=`<div style="font-size:12px;color:var(--text2);margin-bottom:.5rem">Presença por encontro (%)</div><div class="chart-wrap" id="chart-enc"></div>`;
    wrap.appendChild(chartWrap);
    c.appendChild(wrap);
    const chart=el('chart-enc');
    const maxH=100;
    enc.forEach(e=>{
      const total=discipulandos.length||1;
      const pres=chamadas.filter(ch=>ch.encontro_id===e.id&&ch.presente).length;
      const pct=Math.round(pres/total*100);
      const cor=pct>=75?'var(--green)':pct>=50?'var(--amber)':'var(--red)';
      const col=document.createElement('div'); col.className='chart-bar-col';
      col.innerHTML=`<div style="font-size:9px;color:var(--text2);margin-bottom:2px">${pct}%</div><div class="chart-bar" style="height:${Math.max(pct,4)}px;background:${cor};width:100%"></div><div class="chart-label">E${e.numero}</div>`;
      chart.appendChild(col);
    });
  } else { c.appendChild(wrap); }

  const barsWrap=document.createElement('div'); barsWrap.className='box';
  barsWrap.innerHTML=`<div class="sh" style="margin-bottom:.75rem"><span class="sh-t" style="font-size:14px">Por pessoa</span></div><div id="freq-bars"></div><p style="font-size:11px;color:var(--text3);margin-top:.5rem">Verde ≥75% · Âmbar ≥50% · Vermelho &lt;50% · ${real.length} encontro(s) realizado(s)</p>`;
  el('content').appendChild(barsWrap)||c.appendChild(barsWrap);

  // Ensure appended
  if(!c.contains(barsWrap)) c.appendChild(barsWrap);

  setTimeout(()=>{
    const bars=el('freq-bars');
    if(!bars)return;
    discipulandos.forEach(d=>{
      const{pct}=getFreq(d.id);
      const cor=pct>=75?'var(--green)':pct>=50?'var(--amber)':'var(--red)';
      const row=document.createElement('div'); row.className='fb-row';
      row.innerHTML=`<span class="fb-name">${d.nome.split(' ')[0]}</span><div class="fb-track"><div class="fb-fill" style="width:0%;background:${cor}" data-w="${pct}"></div></div><span class="fb-pct">${pct}%</span>`;
      bars.appendChild(row);
    });
    // Animate bars
    requestAnimationFrame(()=>document.querySelectorAll('.fb-fill[data-w]').forEach(el=>{ el.style.width=el.dataset.w+'%'; }));
  },50);

  el('btn-exp-freq')?.addEventListener('click',exportFreq);
  el('btn-exp-full')?.addEventListener('click',exportFull);
}

function exportFreq(){
  const rows=discipulandos.map(d=>{const{pct,pres,total}=getFreq(d.id);return{'Nome':d.nome,'E-mail':d.email||'','Telefone':d.telefone||'','Presenças':pres,'Total':total,'Frequência':pct+'%','Situação':pct>=75?'Regular':pct>=50?'Atenção':'Irregular'};});
  const ws=XLSX.utils.json_to_sheet(rows); ws['!cols']=[{wch:26},{wch:26},{wch:14},{wch:10},{wch:8},{wch:12},{wch:12}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Frequência'); XLSX.writeFile(wb,'frequencia_geral.xlsx');
}
function exportFull(){
  const enc=todosEncontros().filter(e=>e.realizado).sort((a,b)=>a.numero-b.numero);
  const wb=XLSX.utils.book_new();
  const cab=['Nome',...enc.map(e=>`E${e.numero}`.slice(0,20)),'Total ✓','Freq.'];
  const rows=discipulandos.map(d=>{const obj={'Nome':d.nome};let p=0;enc.forEach(e=>{const ch=chamadas.find(c=>c.encontro_id===e.id&&c.discipulando_id===d.id);const v=ch?.presente?'P':'A';if(v==='P')p++;obj[`E${e.numero}`]=v;});obj['Total ✓']=p;obj['Freq.']=enc.length?Math.round(p/enc.length*100)+'%':'0%';return obj;});
  const ws1=XLSX.utils.json_to_sheet(rows,{header:cab}); ws1['!cols']=[{wch:24},...enc.map(()=>({wch:6})),{wch:9},{wch:8}]; XLSX.utils.book_append_sheet(wb,ws1,'Chamada');
  const rowsMat=[];
  modulos.forEach(m=>m.encontros.forEach(e=>e.materiais.forEach(mat=>{rowsMat.push({'Módulo':`${m.numero}. ${m.titulo}`,'Encontro':`${e.numero}. ${e.titulo}`,'Material':mat.nome,'Tipo':mat.tipo,'Link':mat.url});})));
  if(rowsMat.length){const ws2=XLSX.utils.json_to_sheet(rowsMat);XLSX.utils.book_append_sheet(wb,ws2,'Materiais');}
  const rowsRes=discipulandos.map(d=>{const{pct,pres,total}=getFreq(d.id);return{'Nome':d.nome,'Presenças':pres,'Faltas':total-pres,'Frequência':pct+'%','Situação':pct>=75?'Regular':pct>=50?'Atenção':'Irregular'};});
  const ws3=XLSX.utils.json_to_sheet(rowsRes); XLSX.utils.book_append_sheet(wb,ws3,'Resumo');
  XLSX.writeFile(wb,'relatorio_completo.xlsx');
}
</script>
